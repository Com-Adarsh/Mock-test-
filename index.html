<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SFI CUSAT MOCK TEST</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{--primary:#1e40af;--primary-dark:#1e3a8a;--primary-light:#3b82f6;--accent:#f59e0b;
    --success:#10b981;--danger:#ef4444;--warn:#f59e0b;--bg:#f1f5f9;--card:#fff;
    --text:#0f172a;--muted:#64748b;--border:#e2e8f0;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  button{cursor:pointer;font-family:inherit;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px}
  .topbar{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:100}
  .topbar h1{font-size:20px;font-weight:700}
  .topbar .brand{display:flex;align-items:center;gap:10px}
  .topbar .brand-icon{width:36px;height:36px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--primary);font-weight:800}
  .topbar .user-info{display:flex;align-items:center;gap:12px;font-size:14px}
  .topbar .role-badge{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
  .btn-logout{background:rgba(255,255,255,.15);color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500}
  .btn-logout:hover{background:rgba(255,255,255,.25)}
  .container{max-width:1200px;margin:0 auto;padding:24px}
  .landing{min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%)}
  .landing-hero{text-align:center;margin-bottom:40px}
  .landing-hero h2{font-size:42px;color:var(--primary-dark);margin-bottom:12px;font-weight:800}
  .landing-hero p{font-size:17px;color:var(--muted);max-width:560px;margin:0 auto}
  .signin-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:720px;width:100%}
  .signin-card{background:#fff;border-radius:16px;padding:32px 28px;box-shadow:var(--shadow);border:2px solid transparent;transition:all .25s;cursor:pointer;text-align:center}
  .signin-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(30,64,175,.12);border-color:var(--primary-light)}
  .signin-card .icon{width:64px;height:64px;border-radius:16px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px}
  .signin-card.student .icon{background:#dbeafe;color:var(--primary)}
  .signin-card.moderator .icon{background:#fef3c7;color:#b45309}
  .signin-card h3{font-size:20px;margin-bottom:8px}
  .signin-card p{color:var(--muted);font-size:14px;margin-bottom:20px}
  .signin-card .btn{width:100%;padding:12px;border-radius:8px;font-weight:600;font-size:15px}
  .signin-card.student .btn{background:var(--primary);color:#fff}
  .signin-card.moderator .btn{background:#b45309;color:#fff}
  .form-card{background:#fff;border-radius:12px;padding:32px;box-shadow:var(--shadow);max-width:420px;width:100%}
  .form-card h2{margin-bottom:8px;color:var(--primary-dark)}
  .form-card .subtitle{color:var(--muted);margin-bottom:24px;font-size:14px}
  .form-group{margin-bottom:16px}
  .form-group label{display:block;margin-bottom:6px;font-weight:500;font-size:14px}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
  .btn{padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;transition:all .2s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn-secondary:hover{background:var(--bg)}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-warn{background:var(--warn);color:#fff}
  .btn-block{width:100%}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .form-footer{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
  .form-footer a{font-weight:500;color:var(--primary)}
  .error-msg{background:#fef2f2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;border:1px solid #fecaca}
  .info-msg{background:#eff6ff;color:#1e40af;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;border:1px solid #bfdbfe}
  .dash-header{margin-bottom:24px}
  .dash-header h2{font-size:26px;color:var(--primary-dark);margin-bottom:4px}
  .dash-header p{color:var(--muted)}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
  .stat-card{background:#fff;border-radius:12px;padding:18px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
  .stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:6px}
  .stat-card .value{font-size:28px;font-weight:700}
  .stat-card.success{border-left-color:var(--success)}
  .stat-card.warn{border-left-color:var(--warn)}
  .stat-card.danger{border-left-color:var(--danger)}
  .section{background:#fff;border-radius:12px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .section-header h3{font-size:18px}
  .test-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .test-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;transition:all .2s}
  .test-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow)}
  .test-card h4{font-size:16px;margin-bottom:8px}
  .test-card .meta{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0;font-size:13px;color:var(--muted)}
  .test-card .desc{font-size:13px;color:var(--muted);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase}
  .status-draft{background:#f1f5f9;color:#475569}
  .status-published{background:#dcfce7;color:#166534}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:var(--bg);padding:10px 12px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  td{padding:10px 12px;border-bottom:1px solid var(--border)}
  tr:hover td{background:#f8fafc}
  .exam-container{display:grid;grid-template-columns:1fr 280px;gap:16px;height:calc(100vh - 64px);padding:16px}
  .exam-main{background:#fff;border-radius:12px;padding:24px;overflow-y:auto;box-shadow:var(--shadow)}
  .exam-sidebar{background:#fff;border-radius:12px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .exam-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
  .exam-header h2{font-size:20px;color:var(--primary-dark)}
  .timer{background:var(--primary);color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
  .timer.warn{background:var(--warn)}
  .timer.danger{background:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.7}}
  .question-body{margin:20px 0}
  .question-body .q-text{font-size:16px;line-height:1.6;margin-bottom:20px;white-space:pre-wrap}
  .question-body .q-text img{max-width:100%;border-radius:6px;margin-top:10px}
  .q-meta{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
  .q-meta .type-badge{background:var(--bg);padding:3px 10px;border-radius:6px;font-weight:600}
  .options-list{display:flex;flex-direction:column;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s}
  .option:hover{border-color:var(--primary-light);background:#f8fafc}
  .option.selected{border-color:var(--primary);background:#eff6ff}
  .option input{margin-top:3px;accent-color:var(--primary)}
  .option label{flex:1;cursor:pointer;line-height:1.5}
  .nat-input{width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;font-size:16px}
  .nat-input:focus{outline:none;border-color:var(--primary)}
  .exam-actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap}
  .exam-actions .left-actions,.exam-actions .right-actions{display:flex;gap:8px;flex-wrap:wrap}
  .palette-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:10px;letter-spacing:.5px}
  .palette-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;font-size:11px}
  .palette-legend .item{display:flex;align-items:center;gap:6px}
  .palette-legend .swatch{width:18px;height:18px;border-radius:4px;border:1px solid var(--border)}
  .swatch.not-visited{background:#e2e8f0}
  .swatch.answered{background:#bbf7d0}
  .swatch.not-answered{background:#fecaca}
  .swatch.marked{background:#fde68a}
  .palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;overflow-y:auto;flex:1;padding:4px}
  .palette-btn{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);font-weight:600;font-size:13px;cursor:pointer;background:#fff}
  .palette-btn:hover{transform:scale(1.05)}
  .palette-btn.active{outline:3px solid var(--primary);outline-offset:1px}
  .palette-btn.not-visited{background:#e2e8f0;color:#475569}
  .palette-btn.answered{background:#bbf7d0;color:#166534}
  .palette-btn.marked{background:#fde68a;color:#92400e}
  .question-editor{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
  .question-editor .qe-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .question-editor .q-num{font-weight:700;color:var(--primary)}
  .options-editor{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .option-row{display:flex;gap:8px;align-items:center}
  .option-row input[type="text"]{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:6px}
  .option-row input[type="checkbox"]{accent-color:var(--primary);width:18px;height:18px}
  .answer-row{display:flex;gap:8px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
  .answer-row input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;width:140px}
  .pdf-viewer{position:relative;background:#f1f5f9;border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:600px;margin-bottom:16px}
  .pdf-viewer canvas{display:block;margin:0 auto}
  .crop-box{position:absolute;border:2px dashed var(--danger);background:rgba(239,68,68,.1);cursor:move}
  .crop-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5}
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto}
  .tab{padding:10px 18px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;font-size:14px}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
  .tab:hover{color:var(--text)}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .modal{background:#fff;border-radius:12px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:24px}
  .modal h3{margin-bottom:12px;color:var(--primary-dark)}
  .modal .summary-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:12px 20px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:2000;font-size:14px;animation:slideIn .3s}
  .toast.success{background:var(--success)}
  .toast.error{background:var(--danger)}
  .toast.warn{background:var(--warn)}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0}}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:768px){
    .exam-container{grid-template-columns:1fr;height:auto}
    .exam-sidebar{order:-1}
    .palette-grid{grid-template-columns:repeat(8,1fr)}
    .landing-hero h2{font-size:30px}
    .container{padding:16px}
    .topbar{padding:12px 16px}
    .topbar h1{font-size:16px}
  }
</style>

<body>
<div id="app"><div style="padding:40px;text-align:center;color:var(--muted)">Loading…</div></div>

<script>
/* =========================================================================
   SFI CUSAT MOCK TEST — Frontend
   - Hash-based SPA router
   - API layer that calls Apps Script when API_URL is set,
     otherwise falls back to localStorage for local preview
   - Scoring is performed server-side; answer keys never reach students
   ========================================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- CONFIG ----------
   Set API_URL to your deployed Apps Script /exec URL for production.
   Leave empty to use localStorage preview mode. */
const API_URL = '';  // e.g. 'https://script.google.com/macros/s/AKfycb.../exec'

/* ---------- Utilities ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const escapeHtml = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = sec => {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h?String(h).padStart(2,'0')+':':'') + String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
};
const fmtDate = ts => ts ? new Date(ts).toLocaleString() : '—';
function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}
function withSpinner(btn, label='Loading…'){
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> ${label}`;
  return () => { btn.disabled = false; btn.innerHTML = orig; };
}

/* ---------- API layer ---------- */
const API = {
  async call(action, body={}){
    if(!API_URL){
      // Preview mode: handled by LocalDB below
      return LocalDB.handle(action, body);
    }
    const token = localStorage.getItem('sfi_token');
    const res = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({ action, token, ...body })
    });
    const data = await res.json();
    if(!data.ok){
      if(data.error === 'Not authenticated'){ Auth.logout(); Router.go('#/'); }
      throw new Error(data.error || 'Request failed');
    }
    return data;
  }
};

/* ---------- Local fallback (preview mode) ---------- */
const LocalDB = {
  _get(k, d){ try{ return JSON.parse(localStorage.getItem('sfi_'+k)) ?? d; }catch{ return d; } },
  _set(k, v){ localStorage.setItem('sfi_'+k, JSON.stringify(v)); },
  init(){
    const users = this._get('users', []);
    if(!users.find(u => u.role==='moderator')){
      users.push({ id:'mod_default', name:'Administrator', email:'admin@sfi.edu',
        password:'admin123', role:'moderator', status:'active', createdAt: Date.now() });
      this._set('users', users);
    }
  },
  async handle(action, b){
    this.init();
    const users = this._get('users', []);
    const tests = this._get('tests', []);
    const attempts = this._get('attempts', []);
    const responses = this._get('responses', []);
    const token = b.token || localStorage.getItem('sfi_token');
    const session = token ? this._get('sessions', []).find(s => s.token === token) : null;
    const me = session ? users.find(u => u.id === session.userId) : null;

    const save = () => {
      this._set('users', users); this._set('tests', tests);
      this._set('attempts', attempts); this._set('responses', responses);
    };
    const compare = (q, resp) => {
      if(resp === undefined || resp === null || resp === '') return false;
      if(q.type === 'NAT'){
        const a = parseFloat(String(q.answer).trim()), b = parseFloat(String(resp).trim());
        if(isNaN(a)||isNaN(b)) return false; return Math.abs(a-b) < 0.01;
      }
      if(q.type === 'MSQ'){
        const a = (q.answer||'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean).sort().join(',');
        const bb = String(resp).split(',').map(x=>x.trim().toUpperCase()).filter(Boolean).sort().join(',');
        return a === bb;
      }
      return String(q.answer||'').trim().toUpperCase() === String(resp).trim().toUpperCase();
    };
    const score = (att) => {
      const qs = tests.find(t=>t.id===att.testId)?.questions || [];
      let correct=0,wrong=0,skipped=0,score=0;
      for(const q of qs){
        const r = (att.responses||{})[q.id];
        if(r===undefined||r===null||r===''){ skipped++; continue; }
        if(compare(q,r)){ correct++; score += Number(q.marks||0); }
        else { wrong++; score -= Number(q.negativeMarks||0); }
      }
      return { score, correct, wrong, skipped };
    };

    switch(action){
      case 'register': {
        if(users.find(u => u.email.toLowerCase() === b.email.toLowerCase()))
          return { ok:false, error:'Email already registered' };
        const u = { id:'u_'+uid(), name:b.name, email:b.email, password:b.password,
          rollNumber:b.rollNumber||'', role:'student', status:'active', createdAt:Date.now() };
        users.push(u); save();
        const t = 'tk_'+uid();
        this._set('sessions', [...this._get('sessions',[]), { token:t, userId:u.id, role:u.role }]);
        return { ok:true, token:t, user:{ id:u.id, name:u.name, email:u.email, role:u.role, rollNumber:u.rollNumber } };
      }
      case 'login': {
        const u = users.find(x => x.email.toLowerCase() === String(b.email||'').toLowerCase());
        if(!u || u.password !== b.password) return { ok:false, error:'Invalid credentials' };
        const t = 'tk_'+uid();
        this._set('sessions', [...this._get('sessions',[]), { token:t, userId:u.id, role:u.role }]);
        return { ok:true, token:t, user:{ id:u.id, name:u.name, email:u.email, role:u.role, rollNumber:u.rollNumber||'' } };
      }
      case 'listTests': {
        if(!me || me.role !== 'student') return { ok:false, error:'Forbidden' };
        const pub = tests.filter(t => t.status === 'published');
        return { ok:true, tests: pub.map(t => {
          const myAtt = attempts.filter(a => a.testId===t.id && a.studentId===me.id);
          return {
            id:t.id, title:t.title, description:t.description,
            duration:t.duration, totalMarks:t.totalMarks||0,
            attemptLimit:t.attemptLimit||1, questionCount:(t.questions||[]).length,
            attemptsLeft: Math.max(0, (t.attemptLimit||1) - myAtt.filter(a=>a.status==='submitted').length),
            inProgress: myAtt.find(a => a.status==='in-progress' && a.expiresAt > Date.now()) || null
          };
        }) };
      }
      case 'getTest': {
        const t = tests.find(x => x.id === b.testId && x.status === 'published');
        if(!t) return { ok:false, error:'Not found' };
        const qs = (t.questions||[]).map(q => ({
          id:q.id, orderNum:q.order, type:q.type, text:q.text, image:q.image,
          options:q.options||[], marks:q.marks, negativeMarks:q.negativeMarks
        }));
        return { ok:true, test:{ id:t.id, title:t.title, duration:t.duration, totalMarks:t.totalMarks, questions:qs } };
      }
      case 'startAttempt': {
        const t = tests.find(x => x.id === b.testId && x.status === 'published');
        if(!t) return { ok:false, error:'Not found' };
        const mine = attempts.filter(a => a.testId===b.testId && a.studentId===me.id);
        const prog = mine.find(a => a.status==='in-progress');
        if(prog && prog.expiresAt > Date.now()) return { ok:true, attempt:prog, resumed:true };
        if(prog && prog.expiresAt <= Date.now()){
          const s = score(prog); Object.assign(prog, s, { status:'submitted', submittedAt:Date.now() }); save();
        }
        const submitted = mine.filter(a => a.status==='submitted').length;
        if(submitted >= (t.attemptLimit||1)) return { ok:false, error:'Attempt limit reached' };
        const att = { id:'a_'+uid(), testId:t.id, studentId:me.id,
          startedAt:Date.now(), expiresAt:Date.now()+t.duration*60*1000,
          status:'in-progress', responses:{}, review:{}, score:0, correct:0, wrong:0, skipped:0 };
        attempts.push(att); save();
        return { ok:true, attempt:att, resumed:false };
      }
      case 'saveResponse': {
        const att = attempts.find(a => a.id === b.attemptId && a.studentId === me.id);
        if(!att) return { ok:false, error:'Not found' };
        att.responses = att.responses || {};
        if(b.response === '' || b.response === undefined || b.response === null) delete att.responses[b.questionId];
        else att.responses[b.questionId] = b.response;
        save();
        return { ok:true };
      }
      case 'getAttempt': {
        const att = attempts.find(a => a.id === b.attemptId && a.studentId === me.id);
        if(!att) return { ok:false, error:'Not found' };
        return { ok:true, attempt:att, responses: Object.entries(att.responses||{}).map(([q,r])=>({questionId:q,response:r})) };
      }
      case 'submitAttempt': {
        const att = attempts.find(a => a.id === b.attemptId && a.studentId === me.id);
        if(!att) return { ok:false, error:'Not found' };
        if(att.status === 'submitted') return { ok:false, error:'Already submitted' };
        const s = score(att); Object.assign(att, s, { status:'submitted', submittedAt:Date.now() }); save();
        return { ok:true, ...s };
      }
      case 'myResults': {
        const mine = attempts.filter(a => a.studentId === me.id && a.status === 'submitted');
        return { ok:true, results: mine.map(a => {
          const t = tests.find(x => x.id === a.testId);
          return { ...a, testTitle: t?.title||'—', totalMarks: t?.totalMarks||0 };
        }) };
      }
      /* ---- moderator ---- */
      case 'modListTests': {
        return { ok:true, tests: tests.map(t => ({
          ...t, questionCount:(t.questions||[]).length,
          attemptCount: attempts.filter(a=>a.testId===t.id).length
        })) };
      }
      case 'modSaveTest': {
        const t = b.test;
        const existing = tests.find(x => x.id === t.id);
        const qs = existing ? (existing.questions||[]) : [];
        const totalMarks = qs.reduce((s,q)=>s+Number(q.marks||0),0);
        if(existing){
          Object.assign(existing, { title:t.title, description:t.description||'',
            duration:Number(t.duration), attemptLimit:Number(t.attemptLimit||1),
            totalMarks, updatedAt:Date.now() });
        } else {
          tests.push({ id:t.id || 't_'+uid(), title:t.title, description:t.description||'',
            duration:Number(t.duration), totalMarks, attemptLimit:Number(t.attemptLimit||1),
            status:'draft', questions:[], createdAt:Date.now(), updatedAt:Date.now() });
        }
        save();
        return { ok:true, test: existing || tests[tests.length-1] };
      }
      case 'modDeleteTest': {
        const i = tests.findIndex(t => t.id === b.testId);
        if(i>=0) tests.splice(i,1);
        save();
        return { ok:true };
      }
      case 'modPublishTest': {
        const t = tests.find(x => x.id === b.testId);
        if(t){ t.status = b.publish ? 'published' : 'draft'; save(); }
        return { ok:true };
      }
      case 'modListQuestions': {
        const t = tests.find(x => x.id === b.testId);
        return { ok:true, questions: (t?.questions||[]).slice().sort((a,b)=>a.order-b.order) };
      }
      case 'modSaveQuestion': {
        const t = tests.find(x => x.id === b.question.testId);
        if(!t) return { ok:false, error:'Test not found' };
        t.questions = t.questions || [];
        const existing = t.questions.find(q => q.id === b.question.id);
        if(existing){ Object.assign(existing, b.question); }
        else { t.questions.push({ ...b.question, id: b.question.id || 'q_'+uid() }); }
        t.totalMarks = t.questions.reduce((s,q)=>s+Number(q.marks||0),0);
        save();
        return { ok:true, question: b.question };
      }
      case 'modDeleteQuestion': {
        const t = tests.find(x => x.questions?.some(q=>q.id===b.questionId));
        if(t){
          t.questions = t.questions.filter(q => q.id !== b.questionId);
          t.totalMarks = t.questions.reduce((s,q)=>s+Number(q.marks||0),0);
          save();
        }
        return { ok:true };
      }
      case 'modReorderQuestions': {
        const t = tests.find(x => x.id === b.testId);
        if(t){
          const map = {}; t.questions.forEach(q => map[q.id] = q);
          t.questions = b.order.map((id,i) => { const q = map[id]; if(q){ q.order = i+1; } return q; }).filter(Boolean);
          save();
        }
        return { ok:true };
      }
      case 'modAllResults': {
        const submitted = attempts.filter(a => a.status === 'submitted');
        return { ok:true, results: submitted.map(a => {
          const u = users.find(x => x.id === a.studentId);
          const t = tests.find(x => x.id === a.testId);
          return { ...a, studentName: u?.name||'—', rollNumber: u?.rollNumber||'—',
            testTitle: t?.title||'—', totalMarks: t?.totalMarks||0 };
        }) };
      }
      case 'modStudents': {
        const sts = users.filter(u => u.role === 'student');
        return { ok:true, students: sts.map(u => ({
          ...u, attemptCount: attempts.filter(a => a.studentId === u.id).length
        })) };
      }
      default: return { ok:false, error:'Unknown action' };
    }
  }
};

/* ---------- Auth ---------- */
const Auth = {
  current(){
    const raw = localStorage.getItem('sfi_session');
    return raw ? JSON.parse(raw) : null;
  },
  async login(email, password, role){
    const data = await API.call('login', { email, password });
    if(data.user.role !== role) throw new Error(`This account is not a ${role}.`);
    localStorage.setItem('sfi_token', data.token);
    localStorage.setItem('sfi_session', JSON.stringify(data.user));
    return data.user;
  },
  async register(payload){
    const data = await API.call('register', payload);
    localStorage.setItem('sfi_token', data.token);
    localStorage.setItem('sfi_session', JSON.stringify(data.user));
    return data.user;
  },
  logout(){
    localStorage.removeItem('sfi_token');
    localStorage.removeItem('sfi_session');
  },
  requireRole(role){
    const u = this.current();
    if(!u){ Router.go('#/'); throw new Error('Not authenticated'); }
    if(u.role !== role){ toast('Access denied','error'); Router.go('#/'); throw new Error('Forbidden'); }
    return u;
  }
};

/* ---------- Router ---------- */
const Router = {
  routes:{},
  register(p,h){ this.routes[p] = h; },
  go(h){ location.hash = h; },
  start(){
    window.addEventListener('hashchange', () => this.resolve());
    this.resolve();
  },
  resolve(){
    const hash = location.hash || '#/';
    const [path] = hash.slice(2).split('/');
    const key = '/' + (path || '');
    const h = this.routes[key] || this.routes['/'];
    try { h(); } catch(e){ console.error(e); }
  }
};

/* ---------- Exam Engine ---------- */
let examState = null, examTimer = null;

async function startTest(testId){
  try{
    const [testRes, attemptRes] = await Promise.all([
      API.call('getTest', { testId }),
      API.call('startAttempt', { testId })
    ]);
    examState = {
      attempt: attemptRes.attempt,
      test: testRes.test,
      current: 0,
      questions: testRes.test.questions || []
    };
    if(attemptRes.resumed) toast('Resumed your in-progress test', 'info');
    renderExam();
    startExamTimer();
  }catch(err){ toast(err.message, 'error'); }
}

function startExamTimer(){
  clearInterval(examTimer);
  examTimer = setInterval(async () => {
    if(!examState) return;
    const remaining = Math.floor((examState.attempt.expiresAt - Date.now())/1000);
    const timerEl = $('#examTimer');
    if(timerEl){
      timerEl.textContent = fmtTime(remaining);
      timerEl.classList.toggle('warn', remaining < 300 && remaining >= 60);
      timerEl.classList.toggle('danger', remaining < 60);
    }
    if(remaining <= 0){
      clearInterval(examTimer);
      await submitExam(true);
    }
  }, 1000);
}

function renderExam(){
  const { attempt, test, questions, current } = examState;
  const q = questions[current];
  const getStatus = i => {
    const qq = questions[i];
    const ans = attempt.responses?.[qq.id];
    const marked = attempt.review?.[qq.id];
    const has = ans !== undefined && ans !== '' && ans !== null;
    if(marked && has) return 'answered-marked';
    if(marked) return 'marked';
    if(has) return 'answered';
    return 'not-visited';
  };
  $('#app').innerHTML = `
    <div class="topbar">
      <div class="brand"><div class="brand-icon">S</div><h1>${escapeHtml(test.title)}</h1></div>
      <div class="user-info"><span class="role-badge">Exam in progress</span></div>
    </div>
    <div class="exam-container">
      <div class="exam-main">
        <div class="exam-header">
          <h2>Question ${current+1} of ${questions.length}</h2>
          <div class="timer" id="examTimer">${fmtTime(Math.floor((attempt.expiresAt - Date.now())/1000))}</div>
        </div>
        ${q ? `
          <div class="q-meta">
            <span class="type-badge">${q.type}</span>
            <span>+${q.marks} / −${q.negativeMarks}</span>
          </div>
          <div class="question-body">
            <div class="q-text">${q.image ? `<img src="${q.image}" alt="Question"/>` : ''}${escapeHtml(q.text||'')}</div>
            ${renderAnswerInput(q, attempt.responses?.[q.id])}
          </div>
          <div class="exam-actions">
            <div class="left-actions">
              <button class="btn btn-secondary" id="prevBtn" ${current===0?'disabled':''}>← Previous</button>
              <button class="btn btn-secondary" id="clearBtn">Clear Response</button>
            </div>
            <div class="right-actions">
              <button class="btn btn-warn" id="markBtn">${attempt.review?.[q.id]?'Unmark':'Mark for Review'}</button>
              <button class="btn btn-primary" id="saveNextBtn">Save & Next</button>
              ${current === questions.length-1 ? `<button class="btn btn-success" id="submitBtn">Submit Test</button>` : ''}
            </div>
          </div>` : `<div class="empty-state"><p>No questions in this test.</p></div>`}
      </div>
      <div class="exam-sidebar">
        <div class="palette-title">Question Palette</div>
        <div class="palette-legend">
          <div class="item"><div class="swatch not-visited"></div>Not visited</div>
          <div class="item"><div class="swatch answered"></div>Answered</div>
          <div class="item"><div class="swatch not-answered"></div>Not answered</div>
          <div class="item"><div class="swatch marked"></div>Marked</div>
        </div>
        <div class="palette-grid">
          ${questions.map((qq,i) => `<button class="palette-btn ${getStatus(i)} ${i===current?'active':''}" data-q="${i}">${i+1}</button>`).join('')}
        </div>
        <button class="btn btn-success btn-block" id="sideSubmit" style="margin-top:12px">Submit Test</button>
      </div>
    </div>`;
  $('#prevBtn')?.addEventListener('click', () => { examState.current--; renderExam(); });
  $('#saveNextBtn')?.addEventListener('click', async () => {
    await saveCurrentResponse();
    if(current < questions.length-1){ examState.current++; renderExam(); }
  });
  $('#clearBtn')?.addEventListener('click', async () => {
    delete examState.attempt.responses[q.id];
    await API.call('saveResponse', { attemptId: examState.attempt.id, questionId: q.id, response:'' });
    renderExam();
  });
  $('#markBtn')?.addEventListener('click', () => {
    examState.attempt.review = examState.attempt.review || {};
    examState.attempt.review[q.id] = !examState.attempt.review[q.id];
    if(!examState.attempt.review[q.id]) delete examState.attempt.review[q.id];
    renderExam();
  });
  $('#submitBtn')?.addEventListener('click', confirmSubmit);
  $('#sideSubmit')?.addEventListener('click', confirmSubmit);
  $$('.palette-btn').forEach(b => b.onclick = () => { examState.current = +b.dataset.q; renderExam(); });
  bindAnswerInput(q, attempt);
}

function renderAnswerInput(q, currentVal){
  if(q.type === 'MCQ'){
    return `<div class="options-list">${(q.options||[]).map((opt,i) => {
      const letter = String.fromCharCode(65+i);
      const sel = currentVal === letter;
      return `<label class="option ${sel?'selected':''}">
        <input type="radio" name="opt" value="${letter}" ${sel?'checked':''}/>
        <span><strong>${letter}.</strong> ${escapeHtml(opt)}</span></label>`;
    }).join('')}</div>`;
  }
  if(q.type === 'MSQ'){
    const sel = (currentVal||'').split(',').map(x=>x.trim()).filter(Boolean);
    return `<div class="options-list">${(q.options||[]).map((opt,i) => {
      const letter = String.fromCharCode(65+i);
      const checked = sel.includes(letter);
      return `<label class="option ${checked?'selected':''}">
        <input type="checkbox" name="opt" value="${letter}" ${checked?'checked':''}/>
        <span><strong>${letter}.</strong> ${escapeHtml(opt)}</span></label>`;
    }).join('')}</div>`;
  }
  if(q.type === 'NAT'){
    return `<input type="number" step="any" class="nat-input" id="natInput" placeholder="Enter a numeric value" value="${currentVal||''}"/>`;
  }
  return '';
}

function bindAnswerInput(q, attempt){
  if(!q) return;
  if(q.type === 'MCQ'){
    $$('input[name="opt"]').forEach(r => r.onchange = async e => {
      attempt.responses = attempt.responses || {};
      attempt.responses[q.id] = e.target.value;
      $$('.option').forEach(o => o.classList.remove('selected'));
      e.target.closest('.option').classList.add('selected');
      await API.call('saveResponse', { attemptId: attempt.id, questionId: q.id, response: e.target.value });
      updatePalette();
    });
  }
  if(q.type === 'MSQ'){
    $$('input[name="opt"]').forEach(r => r.onchange = async () => {
      const sel = $$('input[name="opt"]:checked').map(x=>x.value).sort().join(',');
      attempt.responses = attempt.responses || {};
      if(!sel) delete attempt.responses[q.id]; else attempt.responses[q.id] = sel;
      $$('.option').forEach(o => o.classList.toggle('selected', o.querySelector('input').checked));
      await API.call('saveResponse', { attemptId: attempt.id, questionId: q.id, response: sel });
      updatePalette();
    });
  }
  if(q.type === 'NAT'){
    const inp = $('#natInput');
    if(inp){
      let saveTimeout;
      inp.oninput = () => {
        attempt.responses = attempt.responses || {};
        if(inp.value === '') delete attempt.responses[q.id]; else attempt.responses[q.id] = inp.value;
        updatePalette();
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          API.call('saveResponse', { attemptId: attempt.id, questionId: q.id, response: inp.value });
        }, 400);
      };
    }
  }
}
function updatePalette(){
  if(!examState) return;
  const { attempt, questions, current } = examState;
  $$('.palette-btn').forEach((b,i) => {
    const qq = questions[i];
    const ans = attempt.responses?.[qq.id];
    const marked = attempt.review?.[qq.id];
    const has = ans !== undefined && ans !== '' && ans !== null;
    let cls = 'not-visited';
    if(marked && has) cls = 'answered-marked';
    else if(marked) cls = 'marked';
    else if(has) cls = 'answered';
    b.className = 'palette-btn ' + cls + (i===current?' active':'');
  });
}

async function saveCurrentResponse(){ /* auto-saved on input */ }

function confirmSubmit(){
  const { attempt, questions } = examState;
  let answered=0, unanswered=0, marked=0;
  questions.forEach(q => {
    const r = attempt.responses?.[q.id];
    const m = attempt.review?.[q.id];
    const has = r !== undefined && r !== '' && r !== null;
    if(m) marked++;
    if(has) answered++; else unanswered++;
  });
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Submit Test?</h3>
      <p>Please review your answers before submitting. This action cannot be undone.</p>
      <div style="margin:16px 0">
        <div class="summary-item"><span>Answered</span><strong style="color:var(--success)">${answered}</strong></div>
        <div class="summary-item"><span>Not Answered</span><strong style="color:var(--danger)">${unanswered}</strong></div>
        <div class="summary-item"><span>Marked for Review</span><strong style="color:var(--warn)">${marked}</strong></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelSubmit">Cancel</button>
        <button class="btn btn-success" id="confirmSubmit">Submit</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  $('#cancelSubmit').onclick = () => overlay.remove();
  $('#confirmSubmit').onclick = async () => { overlay.remove(); await submitExam(false); };
}

async function submitExam(auto){
  clearInterval(examTimer);
  try{
    await API.call('submitAttempt', { attemptId: examState.attempt.id });
    toast(auto ? 'Time up — test submitted' : 'Test submitted successfully', 'success');
  }catch(err){ toast('Submit failed: '+err.message, 'error'); }
  examState = null;
  Router.go('#/student');
}

          </select>

          <input type="number" id="qNeg" placeholder="Negative" value="0" step="0.25" style="width:80px;padding:5px;font-size:12px"/>

    const y = e.clientY - rect.top + viewer.scrollTop;
    box.style.left = Math.min(cropStart.x, x) + 'px';
    box.style.top = Math.min(cropStart.y, y) + 'px';

    box.style.height = Math.abs(y - cropStart.y) + 'px';

    const canvas = $('#pdfCanvas');

    box.style.display = 'none';
    toast('Question added','success');
    renderModCreate();
  });

  bindQuestionEditors(t);
}

function renderQuestionEditor(q, i){
  const optInputs = (q.options||[]).map((opt,j) => `
    <div class="option-row">
      <input type="checkbox" data-correct="${j}" ${isCorrectOption(q,j)?'checked':''}/>
      <strong style="min-width:20px">${String.fromCharCode(65+j)}.</strong>
      <input type="text" data-opt="${j}" value="${escapeHtml(opt)}" placeholder="Option ${String.fromCharCode(65+j)}"/>
    </div>`).join('');
  return `<div class="question-editor" data-qid="${q.id}">
    <div class="qe-header">
      <span class="q-num">Q${i+1} · ${q.type} · +${q.marks}/−${q.negativeMarks}</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-secondary" data-up="${i}" style="padding:4px 10px;font-size:12px" ${i===0?'disabled':''}>↑</button>
        <button class="btn btn-secondary" data-down="${i}" style="padding:4px 10px;font-size:12px">↓</button>
        <button class="btn btn-danger" data-delq="${i}" style="padding:4px 10px;font-size:12px">Delete</button>
      </div>
    </div>
    ${q.image ? `<img src="${q.image}" style="max-width:300px;max-height:180px;border-radius:6px;margin-bottom:8px;display:block"/>` : ''}
    <div class="form-group">
      <label>Question Text</label>
      <textarea data-text rows="2" placeholder="Question text (if not using image)">${escapeHtml(q.text||'')}</textarea>
    </div>
    ${q.type !== 'NAT' ? `
      <label style="font-size:13px;font-weight:500;margin-bottom:6px;display:block">Options (tick correct)</label>
      <div class="options-editor">${optInputs}</div>` : `
      <div class="answer-row">
        <label>Correct Answer (numeric):</label>
        <input type="number" step="any" data-answer value="${escapeHtml(q.answer||'')}" placeholder="e.g. 4.5"/>
      </div>`}
  </div>`;
}
function isCorrectOption(q, j){
  const letter = String.fromCharCode(65+j);
  if(q.type === 'MSQ') return (q.answer||'').split(',').map(x=>x.trim().toUpperCase()).includes(letter);
  return (q.answer||'').trim().toUpperCase() === letter;
}
function bindQuestionEditors(test){
  $$('[data-up]').forEach(b => b.onclick = async () => {
    const i = +b.dataset.up;
    [test.questions[i-1], test.questions[i]] = [test.questions[i], test.questions[i-1]];
    test.questions.forEach((q,idx) => q.order = idx+1);
    await API.call('modReorderQuestions', { testId: test.id, order: test.questions.map(q=>q.id) });
    renderModCreate();
  });
  $$('[data-down]').forEach(b => b.onclick = async () => {
    const i = +b.dataset.down;
    if(i >= test.questions.length-1) return;
    [test.questions[i+1], test.questions[i]] = [test.questions[i], test.questions[i+1]];
    test.questions.forEach((q,idx) => q.order = idx+1);
    await API.call('modReorderQuestions', { testId: test.id, order: test.questions.map(q=>q.id) });
    renderModCreate();
  });
  $$('[data-delq]').forEach(b => b.onclick = async () => {
    if(!confirm('Delete this question?')) return;
    const q = test.questions[+b.dataset.delq];
    await API.call('modDeleteQuestion', { questionId: q.id });
    test.questions.splice(+b.dataset.delq, 1);
    test.questions.forEach((x,idx) => x.order = idx+1);
    renderModCreate();
  });
  $$('.question-editor').forEach(editor => {
    const qid = editor.dataset.qid;
    const q = test.questions.find(x => x.id === qid);
    if(!q) return;
    let saveTimeout;
    const scheduleSave = () => {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        try { await API.call('modSaveQuestion', { question: q }); }
        catch(err){ toast('Save failed: '+err.message,'error'); }
      }, 400);
    };
    editor.querySelector('[data-text]').oninput = e => { q.text = e.target.value; scheduleSave(); };
    if(q.type !== 'NAT'){
      editor.querySelectorAll('[data-opt]').forEach(inp => {
        inp.oninput = e => { q.options[+inp.dataset.opt] = e.target.value; scheduleSave(); };
      });
      editor.querySelectorAll('[data-correct]').forEach(cb => {
        cb.onchange = () => {
          if(q.type === 'MCQ'){
            editor.querySelectorAll('[data-correct]').forEach(x => { if(x!==cb) x.checked=false; });
            q.answer = cb.checked ? String.fromCharCode(65 + +cb.dataset.correct) : '';
          } else {
            q.answer = [...editor.querySelectorAll('[data-correct]:checked')]
              .map(x => String.fromCharCode(65 + +x.dataset.correct)).sort().join(',');
          }
          scheduleSave();
        };
      });
    } else {
      editor.querySelector('[data-answer]').oninput = e => { q.answer = e.target.value; scheduleSave(); };
    }
  });
}

async function renderPdfPage(){
  if(!currentPdf) return;
  const page = await currentPdf.getPage(currentPageNum);
  const viewport = page.getViewport({scale: 1.3});
  const canvas = $('#pdfCanvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  $('#pageNum').textContent = currentPageNum;
  $('#pageCount').textContent = currentPdf.numPages;
}

Router.register('/student', () => {
  if(!Auth.current()) return Router.go('#/student/login');
  if(Auth.current().role !== 'student') return Router.go('#/');
  viewStudentDash();
});
Router.register('/moderator', () => {
  if(!Auth.current()) return Router.go('#/moderator/login');
  if(Auth.current().role !== 'moderator') return Router.go('#/');
  viewModeratorDash();
});

Router.start();
</script>
