<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SFI CUSAT MOCK TEST</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --primary: #1e40af; --primary-dark: #1e3a8a; --primary-light: #3b82f6;
    --success: #10b981; --danger: #ef4444; --warn: #f59e0b;
    --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --border: #e2e8f0; --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  /* Topbar */
  .topbar { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.15); position: sticky; top: 0; z-index: 100; }
  .topbar h1 { font-size: 20px; font-weight: 700; }
  .topbar .brand { display: flex; align-items: center; gap: 10px; }
  .topbar .brand-icon { width: 36px; height: 36px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: 800; }
  .topbar .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .topbar .role-badge { background: rgba(255,255,255,.2); padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .btn-logout { background: rgba(255,255,255,.15); color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; }
  .btn-logout:hover { background: rgba(255,255,255,.25); }

  /* Layout */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .landing { min-height: calc(100vh - 64px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); }
  .landing-hero { text-align: center; margin-bottom: 40px; }
  .landing-hero h2 { font-size: 42px; color: var(--primary-dark); margin-bottom: 12px; font-weight: 800; }
  .landing-hero p { font-size: 17px; color: var(--muted); max-width: 560px; margin: 0 auto; }
  .signin-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; max-width: 720px; width: 100%; }
  .signin-card { background: #fff; border-radius: 16px; padding: 32px 28px; box-shadow: var(--shadow); border: 2px solid transparent; transition: all .25s; cursor: pointer; text-align: center; }
  .signin-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(30,64,175,.12); border-color: var(--primary-light); }
  .signin-card .icon { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .signin-card.student .icon { background: #dbeafe; color: var(--primary); }
  .signin-card.moderator .icon { background: #fef3c7; color: #b45309; }
  .signin-card h3 { font-size: 20px; margin-bottom: 8px; }
  .signin-card p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .signin-card .btn { width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; }
  .signin-card.student .btn { background: var(--primary); color: #fff; }
  .signin-card.moderator .btn { background: #b45309; color: #fff; }

  /* Forms & Cards */
  .form-card { background: #fff; border-radius: 12px; padding: 32px; box-shadow: var(--shadow); max-width: 420px; width: 100%; }
  .form-card h2 { margin-bottom: 8px; color: var(--primary-dark); }
  .form-card .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,64,175,.1); }
  .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--bg); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-warn { background: var(--warn); color: #fff; }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .form-footer { text-align: center; margin-top: 16px; font-size: 14px; color: var(--muted); }
  .form-footer a { font-weight: 500; color: var(--primary); }
  .error-msg { background: #fef2f2; color: #991b1b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; border: 1px solid #fecaca; }
  .info-msg { background: #eff6ff; color: #1e40af; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; border: 1px solid #bfdbfe; }

  /* Dashboard & Tables */
  .dash-header { margin-bottom: 24px; }
  .dash-header h2 { font-size: 26px; color: var(--primary-dark); margin-bottom: 4px; }
  .dash-header p { color: var(--muted); }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: var(--shadow); border-left: 4px solid var(--primary); }
  .stat-card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; margin-bottom: 6px; }
  .stat-card .value { font-size: 28px; font-weight: 700; }
  .stat-card.success { border-left-color: var(--success); }
  .stat-card.warn { border-left-color: var(--warn); }
  .section { background: #fff; border-radius: 12px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .section-header h3 { font-size: 18px; }
  .test-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .test-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 18px; transition: all .2s; }
  .test-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow); }
  .test-card h4 { font-size: 16px; margin-bottom: 8px; }
  .test-card .meta { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0; font-size: 13px; color: var(--muted); }
  .test-card .desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .status-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .status-draft { background: #f1f5f9; color: #475569; }
  .status-published { background: #dcfce7; color: #166534; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: var(--bg); padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: #f8fafc; }

  /* Exam Interface */
  .exam-container { display: grid; grid-template-columns: 1fr 280px; gap: 16px; height: calc(100vh - 64px); padding: 16px; }
  .exam-main { background: #fff; border-radius: 12px; padding: 24px; overflow-y: auto; box-shadow: var(--shadow); }
  .exam-sidebar { background: #fff; border-radius: 12px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
  .exam-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
  .exam-header h2 { font-size: 20px; color: var(--primary-dark); }
  .timer { background: var(--primary); color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .timer.warn { background: var(--warn); }
  .timer.danger { background: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .7; } }
  .question-body { margin: 20px 0; }
  .question-body .q-text { font-size: 16px; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }
  .question-body .q-text img { max-width: 100%; border-radius: 6px; margin-top: 10px; }
  .q-meta { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
  .q-meta .type-badge { background: var(--bg); padding: 3px 10px; border-radius: 6px; font-weight: 600; }
  .options-list { display: flex; flex-direction: column; gap: 10px; }
  .option { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all .15s; }
  .option:hover { border-color: var(--primary-light); background: #f8fafc; }
  .option.selected { border-color: var(--primary); background: #eff6ff; }
  .option input { margin-top: 3px; accent-color: var(--primary); }
  .option label { flex: 1; cursor: pointer; line-height: 1.5; }
  .nat-input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 16px; }
  .nat-input:focus { outline: none; border-color: var(--primary); }
  .exam-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .exam-actions .left-actions, .exam-actions .right-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .palette-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; letter-spacing: .5px; }
  .palette-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; font-size: 11px; }
  .palette-legend .item { display: flex; align-items: center; gap: 6px; }
  .palette-legend .swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border); }
  .swatch.not-visited { background: #e2e8f0; }
  .swatch.answered { background: #bbf7d0; }
  .swatch.not-answered { background: #fecaca; }
  .swatch.marked { background: #fde68a; }
  .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; overflow-y: auto; flex: 1; padding: 4px; }
  .palette-btn { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--border); font-weight: 600; font-size: 13px; cursor: pointer; background: #fff; }
  .palette-btn:hover { transform: scale(1.05); }
  .palette-btn.active { outline: 3px solid var(--primary); outline-offset: 1px; }
  .palette-btn.not-visited { background: #e2e8f0; color: #475569; }
  .palette-btn.answered { background: #bbf7d0; color: #166534; }
  .palette-btn.marked { background: #fde68a; color: #92400e; }

  /* PDF Cropper & Modals */
  .pdf-viewer { position: relative; background: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; overflow: auto; max-height: 600px; margin-bottom: 16px; }
  .pdf-viewer canvas { display: block; margin: 0 auto; }
  .crop-box { position: absolute; border: 2px dashed var(--danger); background: rgba(239,68,68,.1); cursor: move; }
  .crop-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .question-editor { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .question-editor .qe-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .question-editor .q-num { font-weight: 700; color: var(--primary); }
  .options-editor { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .option-row { display: flex; gap: 8px; align-items: center; }
  .option-row input[type="text"] { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; }
  .option-row input[type="checkbox"] { accent-color: var(--primary); width: 18px; height: 18px; }
  .answer-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .answer-row input { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; width: 140px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
  .tab { padding: 10px 18px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px; cursor: pointer; white-space: nowrap; font-size: 14px; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:hover { color: var(--text); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal { background: #fff; border-radius: 12px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 32px; animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal h3 { margin-bottom: 12px; color: var(--primary-dark); }
  .modal .summary-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .message { margin-bottom: 1rem; font-size: 0.9rem; text-align: center; padding: 0.5rem; border-radius: 6px; }
  .message.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .message.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: #fff; padding: 12px 20px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 2000; font-size: 14px; animation: slideIn .3s; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media(max-width: 768px) {
    .exam-container { grid-template-columns: 1fr; height: auto; }
    .exam-sidebar { order: -1; }
    .palette-grid { grid-template-columns: repeat(8, 1fr); }
    .landing-hero h2 { font-size: 30px; }
    .container { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .topbar h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"><div style="padding:40px;text-align:center;color:var(--muted)"><span class="spinner" style="border-color:var(--border);border-top-color:var(--primary)"></span> Loading…</div></div>

<script>
/* =========================================================================
   SFI CUSAT MOCK TEST — Unified Application with Google Sheets Registration
   1. Set GAS_WEB_APP_URL below to your deployed Apps Script URL.
   2. Students MUST register via the modal before accessing tests.
   3. Moderators use local fallback for this unified demo (can be extended to GAS).
   ========================================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ⚠️ REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
const GAS_WEB_APP_URL = 'PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE';

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const escapeHtml = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = sec => {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h?String(h).padStart(2,'0')+':':'') + String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
};
const fmtDate = ts => ts ? new Date(ts).toLocaleString() : '—';
function toast(msg, type='info'){
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 3000);
}
function withSpinner(btn, label='Loading…'){
  const orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> ${label}`;
  return () => { btn.disabled = false; btn.innerHTML = orig; };
}

/* ---------- API Layer (GAS + Local Fallback) ---------- */
const API = {
  async call(action, body={}) {
    if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('PASTE_YOUR')) {
      toast('GAS URL not configured. Using local preview mode.', 'warn');
      return LocalDB.handle(action, body);
    }
    const token = localStorage.getItem('sfi_student_token');
    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action, token, ...body })
      });
      const data = await res.json();
      if (!data.success && !data.ok) throw new Error(data.message || data.error || 'Request failed');
      return data;
    } catch (err) {
      console.error('API Error:', err);
      throw new Error('Network error. Please check your connection.');
    }
  }
};

/* ---------- Local Fallback (Preview Mode) ---------- */
const LocalDB = {
  _get(k, d){ try{ return JSON.parse(localStorage.getItem('sfi_'+k)) ?? d; }catch{ return d; } },
  _set(k, v){ localStorage.setItem('sfi_'+k, JSON.stringify(v)); },
  init(){
    const users = this._get('users', []);
    if(!users.find(u => u.role==='moderator')){
      users.push({ id:'mod_default', name:'Administrator', email:'admin@sfi.edu', password:'admin123', role:'moderator', status:'active', createdAt: Date.now() });
      this._set('users', users);
    }
  },
  async handle(action, b){
    this.init();
    const users = this._get('users', []);
    const tests = this._get('tests', []);
    const attempts = this._get('attempts', []);
    const token = b.token || localStorage.getItem('sfi_student_token');
    const session = token ? this._get('sessions', []).find(s => s.token === token) : null;
    const me = session ? users.find(u => u.id === session.userId) : null;

    if (action === 'register') {
      if (users.find(u => String(u.rollNumber).toUpperCase() === String(b.rollNumber).toUpperCase()))
        return { success: false, message: 'A student with this Roll Number is already registered.' };
      const u = { id:'u_'+uid(), fullName:b.fullName, rollNumber:b.rollNumber.toUpperCase(), email:b.email, phone:b.phone, role:'student', status:'active', createdAt:Date.now() };
      users.push(u); this._set('users', users);
      const t = 'tk_'+uid();
      this._set('sessions', [...this._get('sessions',[]), { token:t, userId:u.id, role:u.role }]);
      return { success: true, message: 'Registration successful!', token: t, student: { fullName: u.fullName, rollNumber: u.rollNumber } };
    }
    if (action === 'login') {
      const u = users.find(x => x.email.toLowerCase() === String(b.email||'').toLowerCase() && x.password === b.password);
      if(!u) return { success: false, message: 'Invalid credentials' };
      const t = 'tk_'+uid();
      this._set('sessions', [...this._get('sessions',[]), { token:t, userId:u.id, role:u.role }]);
      return { success: true, token:t, user:{ id:u.id, name:u.name, email:u.email, role:u.role } };
    }
    if (action === 'listTests') {
      return { success: true, tests: tests.filter(t => t.status === 'published').map(t => ({
        id:t.id, title:t.title, description:t.description, duration:t.duration, totalMarks:t.totalMarks||0,
        attemptLimit:t.attemptLimit||1, questionCount:(t.questions||[]).length,
        attemptsLeft: Math.max(0, (t.attemptLimit||1) - attempts.filter(a=>a.testId===t.id && a.studentId===me.id && a.status==='submitted').length)
      })) };
    }
    if (action === 'modListTests') return { success: true, tests: tests.map(t => ({ ...t, questionCount:(t.questions||[]).length, attemptCount: attempts.filter(a=>a.testId===t.id).length })) };
    if (action === 'modSaveTest') {
      const t = b.test; const existing = tests.find(x => x.id === t.id);
      const qs = existing ? (existing.questions||[]) : [];
      const totalMarks = qs.reduce((s,q)=>s+Number(q.marks||0),0);
      if(existing) Object.assign(existing, { title:t.title, description:t.description||'', duration:Number(t.duration), attemptLimit:Number(t.attemptLimit||1), totalMarks, updatedAt:Date.now() });
      else tests.push({ id:t.id || 't_'+uid(), title:t.title, description:t.description||'', duration:Number(t.duration), totalMarks, attemptLimit:Number(t.attemptLimit||1), status:'draft', questions:[], createdAt:Date.now(), updatedAt:Date.now() });
      this._set('tests', tests);
      return { success: true, test: existing || tests[tests.length-1] };
    }
    if (action === 'modPublishTest') {
      const t = tests.find(x => x.id === b.testId); if(t){ t.status = b.publish ? 'published' : 'draft'; this._set('tests', tests); }
      return { success: true };
    }
    if (action === 'modListQuestions') {
      const t = tests.find(x => x.id === b.testId);
      return { success: true, questions: (t?.questions||[]).slice().sort((a,b)=>a.order-b.order) };
    }
    if (action === 'modSaveQuestion') {
      const t = tests.find(x => x.id === b.question.testId);
      if(!t) return { success: false, message: 'Test not found' };
      t.questions = t.questions || [];
      const existing = t.questions.find(q => q.id === b.question.id);
      if(existing) Object.assign(existing, b.question); else t.questions.push({ ...b.question, id: b.question.id || 'q_'+uid() });
      t.totalMarks = t.questions.reduce((s,q)=>s+Number(q.marks||0),0);
      this._set('tests', tests);
      return { success: true, question: b.question };
    }
    if (action === 'modDeleteQuestion') {
      const t = tests.find(x => x.questions?.some(q=>q.id===b.questionId));
      if(t){ t.questions = t.questions.filter(q => q.id !== b.questionId); t.totalMarks = t.questions.reduce((s,q)=>s+Number(q.marks||0),0); this._set('tests', tests); }
      return { success: true };
    }
    if (action === 'modReorderQuestions') {
      const t = tests.find(x => x.id === b.testId);
      if(t){ const map = {}; t.questions.forEach(q => map[q.id] = q); t.questions = b.order.map((id,i) => { const q = map[id]; if(q){ q.order = i+1; } return q; }).filter(Boolean); this._set('tests', tests); }
      return { success: true };
    }
    if (action === 'modAllResults') {
      const submitted = attempts.filter(a => a.status === 'submitted');
      return { success: true, results: submitted.map(a => {
        const u = users.find(x => x.id === a.studentId); const t = tests.find(x => x.id === a.testId);
        return { ...a, studentName: u?.fullName||u?.name||'—', rollNumber: u?.rollNumber||'—', testTitle: t?.title||'—', totalMarks: t?.totalMarks||0 };
      }) };
    }
    if (action === 'modStudents') {
      const sts = users.filter(u => u.role === 'student');
      return { success: true, students: sts.map(u => ({ ...u, attemptCount: attempts.filter(a => a.studentId === u.id).length })) };
    }
    return { success: false, message: 'Unknown action' };
  }
};

/* ---------- Auth & Session ---------- */
const Auth = {
  currentStudent() {
    const token = localStorage.getItem('sfi_student_token');
    const data = localStorage.getItem('sfi_student_data');
    return (token && data) ? JSON.parse(data) : null;
  },
  currentModerator() {
    const raw = localStorage.getItem('sfi_mod_session');
    return raw ? JSON.parse(raw) : null;
  },
  async registerStudent(payload) {
    const data = await API.call('register', payload);
    if (data.success) {
      localStorage.setItem('sfi_student_token', data.token);
      localStorage.setItem('sfi_student_data', JSON.stringify(data.student));
    }
    return data;
  },
  async loginModerator(email, password) {
    const data = await API.call('login', { email, password });
    if (data.success && data.user.role === 'moderator') {
      localStorage.setItem('sfi_mod_session', JSON.stringify(data.user));
      return data.user;
    }
    throw new Error('Invalid moderator credentials');
  },
  logoutStudent() {
    localStorage.removeItem('sfi_student_token');
    localStorage.removeItem('sfi_student_data');
  },
  logoutModerator() {
    localStorage.removeItem('sfi_mod_session');
  }
};

/* ---------- Router ---------- */
const Router = {
  routes: {},
  register(p, h) { this.routes[p] = h; },
  go(h) { location.hash = h; },
  start() {
    window.addEventListener('hashchange', () => this.resolve());
    this.resolve();
  },
  resolve() {
    const hash = location.hash || '#/';
    const [path] = hash.slice(2).split('/');
    const key = '/' + (path || '');
    const h = this.routes[key] || this.routes['/'];
    try { h(); } catch(e) { console.error(e); }
  }
};

    const rect = viewer.getBoundingClientRect();
    cropStart = { x: e.clientX - rect.left + viewer.scrollLeft, y: e.clientY - rect.top + viewer.scrollTop };

  });
  viewer.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const rect = viewer.getBoundingClientRect();
    const x = e.clientX - rect.left + viewer.scrollLeft, y = e.clientY - rect.top + viewer.scrollTop;
    box.style.left = Math.min(cropStart.x, x) + 'px'; box.style.top = Math.min(cropStart.y, y) + 'px';
    box.style.width = Math.abs(x - cropStart.x) + 'px'; box.style.height = Math.abs(y - cropStart.y) + 'px';
  });
  viewer.addEventListener('mouseup', async () => {
    if (!isDragging) return; isDragging = false;
    const w = parseInt(box.style.width), h = parseInt(box.style.height);
    if (w < 20 || h < 20) { box.style.display='none'; return; }
    const canvas = $('#pdfCanvas');
    const cropCanvas = document.createElement('canvas');
    cropCanvas.width = w; cropCanvas.height = h;
    cropCanvas.getContext('2d').drawImage(canvas, parseInt(box.style.left), parseInt(box.style.top), w, h, 0, 0, w, h);
    const imageData = cropCanvas.toDataURL('image/png');
    const q = {
      id:'q_'+uid(), testId:t.id, order:(t.questions?.length||0)+1,
      type: $('#qType').value, text:'', image:imageData,
      options: $('#qType').value === 'NAT' ? [] : ['','','',''],
      answer:'', marks: +$('#qMarks').value || 1, negativeMarks: +$('#qNeg').value || 0, page:currentPageNum
    };
    await API.call('modSaveQuestion', { question: q });
    t.questions = t.questions || []; t.questions.push(q);
    box.style.display = 'none';
    toast('Question added','success');
    renderModCreate();
  });

  bindQuestionEditors(t);
}

function renderQuestionEditor(q, i) {
  const optInputs = (q.options||[]).map((opt,j) => `
    <div class="option-row">
      <input type="checkbox" data-correct="${j}" ${isCorrectOption(q,j)?'checked':''}/>
      <strong style="min-width:20px">${String.fromCharCode(65+j)}.</strong>
      <input type="text" data-opt="${j}" value="${escapeHtml(opt)}" placeholder="Option ${String.fromCharCode(65+j)}"/>
    </div>`).join('');
  return `<div class="question-editor" data-qid="${q.id}">
    <div class="qe-header">
      <span class="q-num">Q${i+1} · ${q.type} · +${q.marks}/−${q.negativeMarks}</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-secondary" data-up="${i}" style="padding:4px 10px;font-size:12px" ${i===0?'disabled':''}>↑</button>
        <button class="btn btn-secondary" data-down="${i}" style="padding:4px 10px;font-size:12px">↓</button>
        <button class="btn btn-danger" data-delq="${i}" style="padding:4px 10px;font-size:12px">Delete</button>
      </div>
    </div>
    ${q.image ? `<img src="${q.image}" style="max-width:300px;max-height:180px;border-radius:6px;margin-bottom:8px;display:block"/>` : ''}
    <div class="form-group"><label>Question Text</label><textarea data-text rows="2" placeholder="Question text">${escapeHtml(q.text||'')}</textarea></div>
    ${q.type !== 'NAT' ? `
      <label style="font-size:13px;font-weight:500;margin-bottom:6px;display:block">Options (tick correct)</label>
      <div class="options-editor">${optInputs}</div>` : `
      <div class="answer-row"><label>Correct Answer (numeric):</label><input type="number" step="any" data-answer value="${escapeHtml(q.answer||'')}" placeholder="e.g. 4.5"/></div>`}
  </div>`;
}
function isCorrectOption(q, j) {
  const letter = String.fromCharCode(65+j);
  if (q.type === 'MSQ') return (q.answer||'').split(',').map(x=>x.trim().toUpperCase()).includes(letter);
  return (q.answer||'').trim().toUpperCase() === letter;
}
function bindQuestionEditors(test) {
  $$('[data-up]').forEach(b => b.onclick = async () => {
    const i = +b.dataset.up;
    [test.questions[i-1], test.questions[i]] = [test.questions[i], test.questions[i-1]];
    test.questions.forEach((q,idx) => q.order = idx+1);
    await API.call('modReorderQuestions', { testId: test.id, order: test.questions.map(q=>q.id) });
    renderModCreate();
  });
  $$('[data-down]').forEach(b => b.onclick = async () => {
    const i = +b.dataset.down;
    if (i >= test.questions.length-1) return;
    [test.questions[i+1], test.questions[i]] = [test.questions[i], test.questions[i+1]];
    test.questions.forEach((q,idx) => q.order = idx+1);
    await API.call('modReorderQuestions', { testId: test.id, order: test.questions.map(q=>q.id) });
    renderModCreate();
  });
  $$('[data-delq]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete this question?')) return;
    const q = test.questions[+b.dataset.delq];
    await API.call('modDeleteQuestion', { questionId: q.id });
    test.questions.splice(+b.dataset.delq, 1);
    test.questions.forEach((x,idx) => x.order = idx+1);
    renderModCreate();
  });
  $$('.question-editor').forEach(editor => {
    const qid = editor.dataset.qid;
    const q = test.questions.find(x => x.id === qid);
    if (!q) return;
    let saveTimeout;
    const scheduleSave = () => {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        try { await API.call('modSaveQuestion', { question: q }); }
        catch (err) { toast('Save failed: '+err.message,'error'); }
      }, 400);
    };
    editor.querySelector('[data-text]').oninput = e => { q.text = e.target.value; scheduleSave(); };
    if (q.type !== 'NAT') {
      editor.querySelectorAll('[data-opt]').forEach(inp => {
        inp.oninput = e => { q.options[+inp.dataset.opt] = e.target.value; scheduleSave(); };
      });
      editor.querySelectorAll('[data-correct]').forEach(cb => {
        cb.onchange = () => {
          if (q.type === 'MCQ') {
            editor.querySelectorAll('[data-correct]').forEach(x => { if(x!==cb) x.checked=false; });
            q.answer = cb.checked ? String.fromCharCode(65 + +cb.dataset.correct) : '';
          } else {
            q.answer = [...editor.querySelectorAll('[data-correct]:checked')].map(x => String.fromCharCode(65 + +x.dataset.correct)).sort().join(',');
          }
          scheduleSave();
        };
      });
    } else {
      editor.querySelector('[data-answer]').oninput = e => { q.answer = e.target.value; scheduleSave(); };
    }
  });
}
async function renderPdfPage() {
  if (!currentPdf) return;
  const page = await currentPdf.getPage(currentPageNum);
  const viewport = page.getViewport({scale: 1.3});
  const canvas = $('#pdfCanvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  $('#pageNum').textContent = currentPageNum;
  $('#pageCount').textContent = currentPdf.numPages;
}

function renderModResults(results) {
  const c = $('#tabContent');
  c.innerHTML = `
    <div class="section">
      <div class="section-header"><h3>All Results (${(results||[]).length})</h3>
        <button class="btn btn-secondary" id="exportCsv">Export CSV</button>
      </div>
      ${results?.length ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Student</th><th>Roll No</th><th>Test</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Submitted</th></tr></thead>
          <tbody>${results.map(a => `<tr>
            <td>${escapeHtml(a.studentName)}</td><td>${escapeHtml(a.rollNumber)}</td><td>${escapeHtml(a.testTitle)}</td>
            <td><strong>${a.score}</strong> / ${a.totalMarks}</td>
            <td style="color:var(--success)">${a.correct}</td><td style="color:var(--danger)">${a.wrong}</td><td>${a.skipped}</td><td>${fmtDate(a.submittedAt)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`
        : `<div class="empty-state"><p>No submissions yet.</p></div>`}
    </div>`;
  $('#exportCsv').onclick = () => {
    const rows = [['Name','Roll','Test','Score','Correct','Wrong','Skipped','Submitted']];
    results.forEach(a => rows.push([a.studentName,a.rollNumber,a.testTitle,a.score,a.correct,a.wrong,a.skipped,new Date(a.submittedAt).toISOString()]));
    const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'results.csv'; a.click();
  };
}

function renderModStudents(students) {
  const c = $('#tabContent');
  c.innerHTML = `
    <div class="section">
      <h3 style="margin-bottom:16px">Registered Students (${(students||[]).length})</h3>
      ${students?.length ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Roll No</th><th>Email</th><th>Attempts</th><th>Joined</th></tr></thead>
          <tbody>${students.map(s => `<tr>
            <td>${escapeHtml(s.fullName || s.name)}</td><td>${escapeHtml(s.rollNumber||'—')}</td><td>${escapeHtml(s.email)}</td>
            <td>${s.attemptCount}</td><td>${fmtDate(s.createdAt)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`
        : `<div class="empty-state"><p>No students registered yet.</p></div>`}
    </div>`;
}

  else viewLanding();
});
Router.register('/student', viewStudentDash);
Router.register('/moderator/login', viewModeratorLogin);
Router.register('/moderator', viewModeratorDash);

// Initialize
Router.start();
</script>
