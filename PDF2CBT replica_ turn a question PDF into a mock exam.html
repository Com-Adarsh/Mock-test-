<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SFI CUSAT MOCK TEST</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --primary:#1e40af; --primary-dark:#1e3a8a; --primary-light:#3b82f6;
    --accent:#f59e0b; --success:#10b981; --danger:#ef4444; --warn:#f59e0b;
    --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --border:#e2e8f0; --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  a{color:var(--primary);text-decoration:none}
  button{cursor:pointer;font-family:inherit;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px}

  /* Header */
  .topbar{background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:100}
  .topbar h1{font-size:20px;font-weight:700;letter-spacing:.3px}
  .topbar .brand{display:flex;align-items:center;gap:10px}
  .topbar .brand-icon{width:36px;height:36px;background:#fff;border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:var(--primary);font-weight:800}
  .topbar .user-info{display:flex;align-items:center;gap:12px;font-size:14px}
  .topbar .user-info .role-badge{background:rgba(255,255,255,.2);padding:3px 10px;
    border-radius:12px;font-size:12px;font-weight:600}
  .btn-logout{background:rgba(255,255,255,.15);color:#fff;padding:6px 14px;
    border-radius:6px;font-size:13px;font-weight:500;transition:background .2s}
  .btn-logout:hover{background:rgba(255,255,255,.25)}

  /* Container */
  .container{max-width:1200px;margin:0 auto;padding:24px}
  .container.narrow{max-width:520px}

  /* Landing */
  .landing{min-height:calc(100vh - 64px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:40px 20px;
    background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%)}
  .landing-hero{text-align:center;margin-bottom:40px}
  .landing-hero h2{font-size:42px;color:var(--primary-dark);margin-bottom:12px;font-weight:800}
  .landing-hero p{font-size:17px;color:var(--muted);max-width:560px;margin:0 auto}
  .signin-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:24px;max-width:720px;width:100%}
  .signin-card{background:#fff;border-radius:16px;padding:32px 28px;box-shadow:var(--shadow);
    border:2px solid transparent;transition:all .25s;cursor:pointer;text-align:center}
  .signin-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(30,64,175,.12);
    border-color:var(--primary-light)}
  .signin-card .icon{width:64px;height:64px;border-radius:16px;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;font-size:32px}
  .signin-card.student .icon{background:#dbeafe;color:var(--primary)}
  .signin-card.moderator .icon{background:#fef3c7;color:#b45309}
  .signin-card h3{font-size:20px;margin-bottom:8px;color:var(--text)}
  .signin-card p{color:var(--muted);font-size:14px;margin-bottom:20px}
  .signin-card .btn{width:100%;padding:12px;border-radius:8px;font-weight:600;font-size:15px}
  .signin-card.student .btn{background:var(--primary);color:#fff}
  .signin-card.moderator .btn{background:#b45309;color:#fff}

  /* Forms */
  .form-card{background:#fff;border-radius:12px;padding:32px;box-shadow:var(--shadow)}
  .form-card h2{margin-bottom:8px;color:var(--primary-dark)}
  .form-card .subtitle{color:var(--muted);margin-bottom:24px;font-size:14px}
  .form-group{margin-bottom:16px}
  .form-group label{display:block;margin-bottom:6px;font-weight:500;font-size:14px;color:var(--text)}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;
    border:1px solid var(--border);border-radius:8px;transition:border-color .2s}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
  .btn{padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;transition:all .2s;
    display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn-secondary:hover{background:var(--bg)}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-warn{background:var(--warn);color:#fff}
  .btn-block{width:100%}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .form-footer{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
  .form-footer a{font-weight:500}
  .error-msg{background:#fef2f2;color:#991b1b;padding:10px 14px;border-radius:8px;
    font-size:13px;margin-bottom:16px;border:1px solid #fecaca}
  .info-msg{background:#eff6ff;color:#1e40af;padding:10px 14px;border-radius:8px;
    font-size:13px;margin-bottom:16px;border:1px solid #bfdbfe}

  /* Dashboard */
  .dash-header{margin-bottom:24px}
  .dash-header h2{font-size:26px;color:var(--primary-dark);margin-bottom:4px}
  .dash-header p{color:var(--muted)}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px;margin-bottom:28px}
  .stat-card{background:#fff;border-radius:12px;padding:18px;box-shadow:var(--shadow);
    border-left:4px solid var(--primary)}
  .stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.5px;font-weight:600;margin-bottom:6px}
  .stat-card .value{font-size:28px;font-weight:700;color:var(--text)}
  .stat-card.success{border-left-color:var(--success)}
  .stat-card.warn{border-left-color:var(--warn)}
  .stat-card.danger{border-left-color:var(--danger)}

  .section{background:#fff;border-radius:12px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .section-header h3{font-size:18px;color:var(--text)}

  .test-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .test-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;
    transition:all .2s}
  .test-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow)}
  .test-card h4{font-size:16px;margin-bottom:8px;color:var(--text)}
  .test-card .meta{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0;font-size:13px;color:var(--muted)}
  .test-card .meta span{display:flex;align-items:center;gap:4px}
  .test-card .desc{font-size:13px;color:var(--muted);margin-bottom:12px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;
    font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .status-draft{background:#f1f5f9;color:#475569}
  .status-published{background:#dcfce7;color:#166534}
  .status-archived{background:#fef3c7;color:#92400e}
  .status-completed{background:#dbeafe;color:#1e40af}

  /* Tables */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:var(--bg);padding:10px 12px;text-align:left;font-weight:600;
    color:var(--text);border-bottom:2px solid var(--border);font-size:12px;
    text-transform:uppercase;letter-spacing:.3px}
  td{padding:10px 12px;border-bottom:1px solid var(--border)}
  tr:hover td{background:#f8fafc}

  /* Exam interface */
  .exam-container{display:grid;grid-template-columns:1fr 280px;gap:16px;height:calc(100vh - 64px);padding:16px}
  .exam-main{background:#fff;border-radius:12px;padding:24px;overflow-y:auto;box-shadow:var(--shadow)}
  .exam-sidebar{background:#fff;border-radius:12px;padding:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;overflow:hidden}
  .exam-header{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px}
  .exam-header h2{font-size:20px;color:var(--primary-dark)}
  .timer{background:var(--primary);color:#fff;padding:8px 16px;border-radius:8px;
    font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
  .timer.warn{background:var(--warn)}
  .timer.danger{background:var(--danger);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.7}}
  .question-body{margin:20px 0}
  .question-body .q-text{font-size:16px;line-height:1.6;margin-bottom:20px;white-space:pre-wrap}
  .question-body .q-text img{max-width:100%;border-radius:6px;margin-top:10px}
  .q-meta{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
  .q-meta .type-badge{background:var(--bg);padding:3px 10px;border-radius:6px;font-weight:600}
  .options-list{display:flex;flex-direction:column;gap:10px}
  .option{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;
    border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s}
  .option:hover{border-color:var(--primary-light);background:#f8fafc}
  .option.selected{border-color:var(--primary);background:#eff6ff}
  .option input{margin-top:3px;accent-color:var(--primary)}
  .option label{flex:1;cursor:pointer;line-height:1.5}
  .nat-input{width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;font-size:16px}
  .nat-input:focus{outline:none;border-color:var(--primary)}
  .exam-actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px;
    padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap}
  .exam-actions .left-actions,.exam-actions .right-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* Question palette */
  .palette-title{font-size:13px;font-weight:600;color:var(--muted);
    text-transform:uppercase;margin-bottom:10px;letter-spacing:.5px}
  .palette-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;font-size:11px}
  .palette-legend .item{display:flex;align-items:center;gap:6px}
  .palette-legend .swatch{width:18px;height:18px;border-radius:4px;border:1px solid var(--border)}
  .swatch.not-visited{background:#e2e8f0}
  .swatch.not-answered{background:#fecaca}
  .swatch.answered{background:#bbf7d0}
  .swatch.marked{background:#fde68a}
  .swatch.answered-marked{background:#bbf7d0;border:2px solid #f59e0b}
  .palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
    overflow-y:auto;flex:1;padding:4px}
  .palette-btn{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);
    font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;background:#fff}
  .palette-btn:hover{transform:scale(1.05)}
  .palette-btn.active{outline:3px solid var(--primary);outline-offset:1px}
  .palette-btn.not-visited{background:#e2e8f0;color:#475569}
  .palette-btn.not-answered{background:#fecaca;color:#991b1b}
  .palette-btn.answered{background:#bbf7d0;color:#166534}
  .palette-btn.marked{background:#fde68a;color:#92400e}
  .palette-btn.answered-marked{background:#bbf7d0;color:#166534;border:2px solid #f59e0b}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;
    align-items:center;justify-content:center;z-index:1000;padding:20px}
  .modal{background:#fff;border-radius:12px;max-width:500px;width:100%;
    max-height:90vh;overflow-y:auto;padding:24px}
  .modal h3{margin-bottom:12px;color:var(--primary-dark)}
  .modal .summary-list{margin:16px 0}
  .modal .summary-item{display:flex;justify-content:space-between;padding:8px 0;
    border-bottom:1px solid var(--border);font-size:14px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

  /* PDF cropper */
  .pdf-viewer{position:relative;background:#f1f5f9;border:1px solid var(--border);
    border-radius:8px;overflow:auto;max-height:600px;margin-bottom:16px}
  .pdf-viewer canvas{display:block;margin:0 auto}
  .crop-box{position:absolute;border:2px dashed var(--danger);background:rgba(239,68,68,.1);
    cursor:move}
  .crop-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .crop-controls label{font-size:13px;font-weight:500}

  /* Question editor */
  .question-editor{background:#f8fafc;border:1px solid var(--border);border-radius:8px;
    padding:16px;margin-bottom:12px}
  .question-editor .qe-header{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;gap:10px;flex-wrap:wrap}
  .question-editor .qe-header .q-num{font-weight:700;color:var(--primary)}
  .options-editor{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .option-row{display:flex;gap:8px;align-items:center}
  .option-row input[type="text"]{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:6px}
  .option-row input[type="checkbox"]{accent-color:var(--primary);width:18px;height:18px}
  .answer-row{display:flex;gap:8px;align-items:center;margin-top:8px;padding-top:8px;
    border-top:1px dashed var(--border)}
  .answer-row label{font-size:13px;font-weight:500}
  .answer-row input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;width:140px}

  .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5}
  .empty-state p{font-size:14px}

  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto}
  .tab{padding:10px 18px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;
    margin-bottom:-2px;cursor:pointer;white-space:nowrap;font-size:14px}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
  .tab:hover{color:var(--text)}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;
    padding:12px 20px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);
    z-index:2000;font-size:14px;animation:slideIn .3s}
  .toast.success{background:var(--success)}
  .toast.error{background:var(--danger)}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0}}

  @media(max-width:768px){
    .exam-container{grid-template-columns:1fr;height:auto}
    .exam-sidebar{order:-1}
    .palette-grid{grid-template-columns:repeat(8,1fr)}
    .landing-hero h2{font-size:30px}
    .container{padding:16px}
    .topbar{padding:12px 16px}
    .topbar h1{font-size:16px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   SFI CUSAT MOCK TEST — Unified Application
   Architecture:
   - Hash-based SPA router
   - Role-based auth (student / moderator) with backend-style validation
   - Data layer using localStorage (swap for Supabase/Apps Script in prod)
   - Scoring happens in the data layer, never in the exam UI
   ========================================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- Utilities ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const escapeHtml = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = sec => {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return (h?String(h).padStart(2,'0')+':':'') + String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
};
const fmtDate = ts => new Date(ts).toLocaleString();

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}

/* ---------- Data Layer (localStorage-backed, simulates backend) ----------
   In production, replace this module with fetch() calls to your API.
   All "server" logic (scoring, validation) lives here so the UI cannot
   bypass it. Answer keys are never sent to student clients.
-------------------------------------------------------------------------- */
const DB = {
  _get(k, def){ try{ return JSON.parse(localStorage.getItem('sfi_'+k)) ?? def; }catch{ return def; } },
  _set(k, v){ localStorage.setItem('sfi_'+k, JSON.stringify(v)); },

  /* Users */
  getUsers(){ return this._get('users', []); },
  saveUsers(u){ this._set('users', u); },
  findUserByEmail(email){ return this.getUsers().find(u => u.email.toLowerCase() === email.toLowerCase()); },
  createUser(data){
    const users = this.getUsers();
    if(users.find(u => u.email.toLowerCase() === data.email.toLowerCase()))
      throw new Error('Email already registered');
    const user = { id: uid(), role:'student', status:'active', createdAt: Date.now(), ...data };
    users.push(user); this.saveUsers(users); return user;
  },
  /* Moderator bootstrap — only one default admin. In production, moderators
     are created by a super-admin, never via public registration. */
  ensureModerator(){
    const users = this.getUsers();
    if(!users.find(u => u.role==='moderator')){
      users.push({
        id:'mod_default', name:'Administrator', email:'admin@sfi.edu',
        password:'admin123', role:'moderator', status:'active', createdAt: Date.now()
      });
      this.saveUsers(users);
    }
  },

  /* Tests */
  getTests(){ return this._get('tests', []); },
  saveTests(t){ this._set('tests', t); },
  getTest(id){ return this.getTests().find(t => t.id === id); },
  saveTest(test){
    const tests = this.getTests();
    const i = tests.findIndex(t => t.id === test.id);
    if(i>=0) tests[i] = test; else tests.push(test);
    this.saveTests(tests);
  },
  deleteTest(id){ this.saveTests(this.getTests().filter(t => t.id !== id)); },

  /* Attempts */
  getAttempts(){ return this._get('attempts', []); },
  saveAttempts(a){ this._set('attempts', a); },
  getAttempt(id){ return this.getAttempts().find(a => a.id === id); },
  getStudentAttempts(studentId){ return this.getAttempts().filter(a => a.studentId === studentId); },
  getTestAttempts(testId){ return this.getAttempts().filter(a => a.testId === testId); },
  saveAttempt(attempt){
    const all = this.getAttempts();
    const i = all.findIndex(a => a.id === attempt.id);
    if(i>=0) all[i] = attempt; else all.push(attempt);
    this.saveAttempts(all);
  },

  /* Server-side scoring — the ONLY place answer keys are consulted */
  scoreAttempt(attemptId){
    const attempt = this.getAttempt(attemptId);
    if(!attempt) throw new Error('Attempt not found');
    const test = this.getTest(attempt.testId);
    if(!test) throw new Error('Test not found');
    let correct=0, wrong=0, skipped=0, score=0;
    for(const q of test.questions){
      const resp = (attempt.responses||{})[q.id];
      const isCorrect = this._compareAnswer(q, resp);
      if(resp === undefined || resp === null || resp === ''){ skipped++; }
      else if(isCorrect){ correct++; score += (q.marks||0); }
      else { wrong++; score -= (q.negativeMarks||0); }
    }
    attempt.score = score;
    attempt.correct = correct;
    attempt.wrong = wrong;
    attempt.skipped = skipped;
    attempt.status = 'submitted';
    attempt.submittedAt = Date.now();
    this.saveAttempt(attempt);
    return attempt;
  },
  _compareAnswer(q, resp){
    if(resp === undefined || resp === null || resp === '') return false;
    if(q.type === 'NAT'){
      const a = parseFloat(String(q.answer).trim());
      const b = parseFloat(String(resp).trim());
      if(isNaN(a) || isNaN(b)) return false;
      return Math.abs(a-b) < 0.01;
    }
    if(q.type === 'MSQ'){
      const a = (q.answer||'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean).sort().join(',');
      const b = String(resp).split(',').map(x=>x.trim().toUpperCase()).filter(Boolean).sort().join(',');
      return a === b;
    }
    // MCQ
    return String(q.answer||'').trim().toUpperCase() === String(resp).trim().toUpperCase();
  }
};
DB.ensureModerator();

/* ---------- Auth ---------- */
const Auth = {
  current(){ return DB._get('session', null); },
  login(email, password){
    const user = DB.findUserByEmail(email);
    if(!user) throw new Error('No account found with that email');
    if(user.password !== password) throw new Error('Incorrect password');
    if(user.status !== 'active') throw new Error('Account is not active');
    const session = { id:user.id, name:user.name, email:user.email, role:user.role };
    DB._set('session', session);
    return session;
  },
  logout(){ localStorage.removeItem('sfi_session'); },
  requireRole(role){
    const u = this.current();
    if(!u) { Router.go('#/'); throw new Error('Not authenticated'); }
    if(u.role !== role){ toast('Access denied','error'); Router.go('#/'); throw new Error('Forbidden'); }
    return u;
  }
};

/* ---------- Router ---------- */
const Router = {
  routes: {},
  register(path, handler){ this.routes[path] = handler; },
  go(hash){ location.hash = hash; },
  start(){
    window.addEventListener('hashchange', () => this.resolve());
    this.resolve();
  },
  resolve(){
    const hash = location.hash || '#/';
    const [path, ...rest] = hash.slice(2).split('/');
    const key = '/' + (path || '');
    const handler = this.routes[key] || this.routes['/'];
    try { handler(rest.join('/')); } catch(e){ console.error(e); }
  }
};

/* ----- Exam Engine ----- */
let examState = null;
let examTimer = null;

function startTest(testId){
  const user = Auth.current();
  const test = DB.getTest(testId);
  if(!test || test.status !== 'published'){ toast('Test unavailable','error'); return; }

  // Resume or create attempt
  let attempt = DB.getStudentAttempts(user.id).find(a => a.testId===testId && a.status==='in-progress');
  if(!attempt){
    const existing = DB.getStudentAttempts(user.id).filter(a => a.testId===testId && a.status==='submitted').length;
    if(existing >= (test.attemptLimit||1)){ toast('Attempt limit reached','error'); return; }
    attempt = {
      id: uid(), testId, studentId: user.id,
      startedAt: Date.now(),
      expiresAt: Date.now() + (test.duration*60*1000),
      status:'in-progress', responses:{}, review:{}
    };
    DB.saveAttempt(attempt);
  } else {
    // Check expiry
    if(Date.now() > attempt.expiresAt){
      DB.scoreAttempt(attempt.id);
      toast('Time expired — test auto-submitted','warn');
      Router.go('#/student'); return;
    }
  }

  examState = {
    attempt, test,
    current: 0,
    questions: test.questions || []
  };
  renderExam();
  startExamTimer();
}

function startExamTimer(){
  clearInterval(examTimer);
  examTimer = setInterval(() => {
    if(!examState) return;
    const remaining = Math.floor((examState.attempt.expiresAt - Date.now())/1000);
    const timerEl = $('#examTimer');
    if(timerEl){
      timerEl.textContent = fmtTime(remaining);
      timerEl.classList.toggle('warn', remaining < 300 && remaining >= 60);
      timerEl.classList.toggle('danger', remaining < 60);
    }
    if(remaining <= 0){
      clearInterval(examTimer);
      submitExam(true);
    }
  }, 1000);
}

function renderExam(){
  const { attempt, test, questions, current } = examState;
  const q = questions[current];
  const app = $('#app');

  const getQStatus = (i) => {
    const qq = questions[i];
    const answered = attempt.responses[qq.id] !== undefined && attempt.responses[qq.id] !== '' && attempt.responses[qq.id] !== null;
    const marked = attempt.review[qq.id];
    if(marked && answered) return 'answered-marked';
    if(marked) return 'marked';
    if(answered) return 'answered';
    return 'not-visited';
  };

  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><div class="brand-icon">S</div><h1>${escapeHtml(test.title)}</h1></div>
      <div class="user-info"><span class="role-badge">Exam in progress</span></div>
    </div>
    <div class="exam-container">
      <div class="exam-main">
        <div class="exam-header">
          <div>
            <h2>Question ${current+1} of ${questions.length}</h2>
          </div>
          <div class="timer" id="examTimer">${fmtTime(Math.floor((attempt.expiresAt - Date.now())/1000))}</div>
        </div>
        ${q ? `
          <div class="q-meta">
            <span class="type-badge">${q.type}</span>
            <span>+${q.marks||0} / −${q.negativeMarks||0}</span>
          </div>
          <div class="question-body">
            <div class="q-text">${q.image ? `<img src="${q.image}" alt="Question"/>` : ''}${escapeHtml(q.text||'')}</div>
            ${renderAnswerInput(q, attempt.responses[q.id])}
          </div>
          <div class="exam-actions">
            <div class="left-actions">
              <button class="btn btn-secondary" id="prevBtn" ${current===0?'disabled':''}>← Previous</button>
              <button class="btn btn-secondary" id="clearBtn">Clear Response</button>
            </div>
            <div class="right-actions">
              <button class="btn btn-warn" id="markBtn">${attempt.review[q.id]?'Unmark':'Mark for Review'}</button>
              <button class="btn btn-primary" id="saveNextBtn">Save & Next</button>
              ${current === questions.length-1 ? `<button class="btn btn-success" id="submitBtn">Submit Test</button>` : ''}
            </div>
          </div>
        ` : `<div class="empty-state"><p>No questions in this test.</p></div>`}
      </div>
      <div class="exam-sidebar">
        <div class="palette-title">Question Palette</div>
        <div class="palette-legend">
          <div class="item"><div class="swatch not-visited"></div>Not visited</div>
          <div class="item"><div class="swatch answered"></div>Answered</div>
          <div class="item"><div class="swatch not-answered"></div>Not answered</div>
          <div class="item"><div class="swatch marked"></div>Marked</div>
        </div>
        <div class="palette-grid">
          ${questions.map((qq,i) => `<button class="palette-btn ${getQStatus(i)} ${i===current?'active':''}" data-q="${i}">${i+1}</button>`).join('')}
        </div>
        <button class="btn btn-success btn-block" id="sideSubmit" style="margin-top:12px">Submit Test</button>
      </div>
    </div>`;

  // Bind events
  $('#prevBtn')?.addEventListener('click', () => { examState.current--; renderExam(); });
  $('#saveNextBtn')?.addEventListener('click', () => { saveCurrentResponse(); if(current < questions.length-1){ examState.current++; renderExam(); } });
  $('#clearBtn')?.addEventListener('click', () => { delete examState.attempt.responses[q.id]; DB.saveAttempt(examState.attempt); renderExam(); });
  $('#markBtn')?.addEventListener('click', () => {
    examState.attempt.review[q.id] = !examState.attempt.review[q.id];
    if(!examState.attempt.review[q.id]) delete examState.attempt.review[q.id];
    DB.saveAttempt(examState.attempt); renderExam();
  });
  $('#submitBtn')?.addEventListener('click', confirmSubmit);
  $('#sideSubmit')?.addEventListener('click', confirmSubmit);
  $$('.palette-btn').forEach(b => b.onclick = () => { examState.current = +b.dataset.q; renderExam(); });

  // Answer input binding
  bindAnswerInput(q, attempt);
}

function renderAnswerInput(q, currentVal){
  if(q.type === 'MCQ'){
    return `<div class="options-list">${(q.options||[]).map((opt,i) => {
      const letter = String.fromCharCode(65+i);
      const sel = currentVal === letter ? 'checked' : '';
      return `<label class="option ${sel?'selected':''}">
        <input type="radio" name="opt" value="${letter}" ${sel}/>
        <span><strong>${letter}.</strong> ${escapeHtml(opt)}</span>
      </label>`;
    }).join('')}</div>`;
  }
  if(q.type === 'MSQ'){
    const sel = (currentVal||'').split(',').map(x=>x.trim()).filter(Boolean);
    return `<div class="options-list">${(q.options||[]).map((opt,i) => {
      const letter = String.fromCharCode(65+i);
      const checked = sel.includes(letter);
      return `<label class="option ${checked?'selected':''}">
        <input type="checkbox" name="opt" value="${letter}" ${checked?'checked':''}/>
        <span><strong>${letter}.</strong> ${escapeHtml(opt)}</span>
      </label>`;
    }).join('')}</div>`;
  }
  if(q.type === 'NAT'){
    return `<input type="number" step="any" class="nat-input" id="natInput" placeholder="Enter a numeric value" value="${currentVal||''}"/>`;
  }
  return '';
}

function bindAnswerInput(q, attempt){
  if(!q) return;
  if(q.type === 'MCQ'){
    $$('input[name="opt"]').forEach(r => r.onchange = e => {
      attempt.responses[q.id] = e.target.value;
      DB.saveAttempt(attempt);
      $$('.option').forEach(o => o.classList.remove('selected'));
      e.target.closest('.option').classList.add('selected');
    });
  }
  if(q.type === 'MSQ'){
    $$('input[name="opt"]').forEach(r => r.onchange = () => {
      const sel = $$('input[name="opt"]:checked').map(x=>x.value).sort().join(',');
      attempt.responses[q.id] = sel || undefined;
      if(!sel) delete attempt.responses[q.id];
      DB.saveAttempt(attempt);
      $$('.option').forEach(o => {
        const cb = o.querySelector('input');
        o.classList.toggle('selected', cb.checked);
      });
    });
  }
  if(q.type === 'NAT'){
    const inp = $('#natInput');
    if(inp){
      inp.oninput = () => {
        if(inp.value === '') delete attempt.responses[q.id];
        else attempt.responses[q.id] = inp.value;
        DB.saveAttempt(attempt);
      };
    }
  }
}

function saveCurrentResponse(){
  // Responses are already saved on input change; this is a no-op placeholder
  // for explicit "Save & Next" semantics.
  DB.saveAttempt(examState.attempt);
}

function confirmSubmit(){
  const { attempt, questions } = examState;
  let answered=0, unanswered=0, marked=0, notVisited=0;
  questions.forEach(q => {
    const r = attempt.responses[q.id];
    const m = attempt.review[q.id];
    const has = r !== undefined && r !== '' && r !== null;
    if(m) marked++;
    if(has) answered++; else { unanswered++; if(!m) notVisited++; }
  });
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Submit Test?</h3>
      <p>Please review your answers before submitting. This action cannot be undone.</p>
      <div class="summary-list">
        <div class="summary-item"><span>Answered</span><strong style="color:var(--success)">${answered}</strong></div>
        <div class="summary-item"><span>Not Answered</span><strong style="color:var(--danger)">${unanswered}</strong></div>
        <div class="summary-item"><span>Marked for Review</span><strong style="color:var(--warn)">${marked}</strong></div>
        <div class="summary-item"><span>Not Visited</span><strong>${notVisited}</strong></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelSubmit">Cancel</button>
        <button class="btn btn-success" id="confirmSubmit">Submit</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  $('#cancelSubmit').onclick = () => overlay.remove();
  $('#confirmSubmit').onclick = () => { overlay.remove(); submitExam(false); };
}

function submitExam(auto){
  clearInterval(examTimer);
  const { attempt } = examState;
  DB.scoreAttempt(attempt.id); // server-side scoring
  examState = null;
  toast(auto ? 'Time up — test submitted' : 'Test submitted successfully', 'success');
  Router.go('#/student');
}

function showReview(attemptId){
  const attempt = DB.getAttempt(attemptId);
  if(!attempt) return;
  const user = Auth.current();
  if(attempt.studentId !== user.id){ toast('Access denied','error'); return; }
  const test = DB.getTest(attempt.testId);
  if(!test) return;

  const app = $('#app');
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><div class="brand-icon">S</div><h1>Result: ${escapeHtml(test.title)}</h1></div>
      <button class="btn-logout" id="backBtn">← Back</button>
    </div>
    <div class="container">
      <div class="stats-grid">
        <div class="stat-card success"><div class="label">Score</div><div class="value">${attempt.score} / ${test.totalMarks||0}</div></div>
        <div class="stat-card"><div class="label">Correct</div><div class="value">${attempt.correct}</div></div>
        <div class="stat-card danger"><div class="label">Wrong</div><div class="value">${attempt.wrong}</div></div>
        <div class="stat-card warn"><div class="label">Skipped</div><div class="value">${attempt.skipped}</div></div>
      </div>
      <div class="section">
        <h3 style="margin-bottom:16px">Question-wise Review</h3>
        ${(test.questions||[]).map((q,i) => {
          const resp = attempt.responses[q.id];
          const isCorrect = DB._compareAnswer(q, resp);
          const skipped = resp === undefined || resp === null || resp === '';
          let statusColor = 'var(--muted)', statusText = 'Skipped';
          if(!skipped){ statusColor = isCorrect ? 'var(--success)' : 'var(--danger)'; statusText = isCorrect ? 'Correct' : 'Wrong'; }
          return `<div style="padding:14px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;border-left:4px solid ${statusColor}">
            <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
              <strong>Q${i+1}. <span class="type-badge" style="background:var(--bg);padding:2px 8px;border-radius:4px;font-size:11px">${q.type}</span></strong>
              <span style="color:${statusColor};font-weight:600">${statusText}</span>
            </div>
            <div style="margin:8px 0;white-space:pre-wrap">${escapeHtml(q.text||'')}</div>
            <div style="font-size:13px;color:var(--muted)">Your answer: <strong style="color:var(--text)">${escapeHtml(resp||'—')}</strong></div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  $('#backBtn').onclick = () => Router.go('#/student');
}

function renderModTests(c, tests){
  if(!tests.length){
    c.innerHTML = `<div class="section"><div class="empty-state"><div class="icon">📋</div><p>No tests yet. Click "Create Test" to make your first one.</p></div></div>`;
    return;
  }
  c.innerHTML = `<div class="section">
    <div class="section-header"><h3>All Tests (${tests.length})</h3></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Title</th><th>Questions</th><th>Duration</th><th>Marks</th><th>Status</th><th>Attempts</th><th></th></tr></thead>
      <tbody>${tests.map(t => {
        const att = DB.getTestAttempts(t.id).length;
        return `<tr>
          <td><strong>${escapeHtml(t.title)}</strong><br><small style="color:var(--muted)">${escapeHtml((t.description||'').slice(0,60))}</small></td>
          <td>${t.questions?.length||0}</td>
          <td>${t.duration} min</td>
          <td>${t.totalMarks||0}</td>
          <td><span class="status-badge status-${t.status}">${t.status}</span></td>
          <td>${att}</td>
          <td>
            <button class="btn btn-secondary" data-edit="${t.id}" style="padding:5px 10px;font-size:12px">Edit</button>
            <button class="btn btn-secondary" data-toggle="${t.id}" style="padding:5px 10px;font-size:12px">${t.status==='published'?'Unpublish':'Publish'}</button>
            <button class="btn btn-danger" data-del="${t.id}" style="padding:5px 10px;font-size:12px">Delete</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
  $$('[data-edit]').forEach(b => b.onclick = () => { modTab='create'; editingTestId = b.dataset.edit; viewModeratorDash(); });
  $$('[data-toggle]').forEach(b => b.onclick = () => {
    const t = DB.getTest(b.dataset.toggle);
    t.status = t.status === 'published' ? 'draft' : 'published';
    DB.saveTest(t); toast('Test ' + t.status, 'success'); viewModeratorDash();
  });
  $$('[data-del]').forEach(b => b.onclick = () => {
    if(confirm('Delete this test? This cannot be undone.')){
      DB.deleteTest(b.dataset.del); toast('Test deleted','success'); viewModeratorDash();
    }
  });
}

let editingTestId = null;
let currentPdf = null;
let currentPageNum = 1;
let cropRect = null;
let cropStart = null;
let isDragging = false;

function renderModCreate(c){
  const test = editingTestId ? DB.getTest(editingTestId) : {
    id: uid(), title:'', description:'', duration:60, totalMarks:0,
    attemptLimit:1, status:'draft', questions:[], createdAt: Date.now()
  };
  if(!editingTestId) editingTestId = test.id;

  c.innerHTML = `
    <div class="section">
      <h3 style="margin-bottom:16px">${editingTestId && DB.getTest(editingTestId)?.title ? 'Edit Test' : 'Create New Test'}</h3>
      <form id="testMetaForm">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
          <div class="form-group"><label>Test Title</label><input name="title" value="${escapeHtml(test.title)}" required/></div>
          <div class="form-group"><label>Duration (minutes)</label><input type="number" name="duration" min="1" value="${test.duration}" required/></div>
          <div class="form-group"><label>Attempt Limit</label><input type="number" name="attemptLimit" min="1" value="${test.attemptLimit||1}" required/></div>
        </div>
        <div class="form-group"><label>Description</label><textarea name="description" rows="2">${escapeHtml(test.description||'')}</textarea></div>
        <button type="submit" class="btn btn-primary">Save Metadata</button>
      </form>
    </div>

    <div class="section">
      <div class="section-header">
        <h3>Questions (${(test.questions||[]).length})</h3>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" id="addManualQ">+ Add Manually</button>
          <button class="btn btn-primary" id="publishBtn">${test.status==='published'?'Update Published':'Publish Test'}</button>
        </div>
      </div>

      <div id="pdfSection" style="margin-bottom:20px">
        <h4 style="margin-bottom:10px">Upload PDF & Crop Questions</h4>
        <div class="crop-controls">
          <input type="file" id="pdfFile" accept="application/pdf"/>
          <label>Page: <span id="pageNum">1</span> / <span id="pageCount">—</span></label>
          <button class="btn btn-secondary" id="prevPage" style="padding:5px 10px;font-size:12px">←</button>
          <button class="btn btn-secondary" id="nextPage" style="padding:5px 10px;font-size:12px">→</button>
          <select id="qType" style="padding:5px 10px;font-size:12px">
            <option value="MCQ">MCQ</option><option value="MSQ">MSQ</option><option value="NAT">NAT</option>
          </select>
          <input type="number" id="qMarks" placeholder="Marks" value="1" style="width:70px;padding:5px;font-size:12px"/>
          <input type="number" id="qNeg" placeholder="Negative" value="0" step="0.25" style="width:80px;padding:5px;font-size:12px"/>
        </div>
        <div class="pdf-viewer" id="pdfViewer">
          <canvas id="pdfCanvas"></canvas>
          <div id="cropBox" class="crop-box" style="display:none"></div>
        </div>
        <p style="font-size:12px;color:var(--muted);margin-top:6px">Click and drag on the PDF to select a question region. Fill in the answer below the form after cropping.</p>
      </div>

      <div id="questionsList">
        ${(test.questions||[]).map((q,i) => renderQuestionEditor(q,i)).join('') || '<div class="empty-state"><p>No questions yet. Add manually or crop from PDF.</p></div>'}
      </div>
    </div>`;

  // Metadata form
  $('#testMetaForm').onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    test.title = fd.get('title');
    test.description = fd.get('description');
    test.duration = +fd.get('duration');
    test.attemptLimit = +fd.get('attemptLimit');
    test.totalMarks = (test.questions||[]).reduce((s,q)=>s+(q.marks||0),0);
    DB.saveTest(test);
    toast('Test metadata saved','success');
    renderModCreate(c);
  };

  $('#publishBtn').onclick = () => {
    if(!(test.questions||[]).length){ toast('Add at least one question','error'); return; }
    if(!test.title){ toast('Enter a test title','error'); return; }
    test.status = 'published';
    test.totalMarks = test.questions.reduce((s,q)=>s+(q.marks||0),0);
    DB.saveTest(test);
    toast('Test published','success');
    modTab = 'tests'; viewModeratorDash();
  };

  $('#addManualQ').onclick = () => {
    test.questions = test.questions || [];
    test.questions.push({
      id: uid(), type:'MCQ', text:'', options:['','','',''],
      answer:'', marks:1, negativeMarks:0, order: test.questions.length+1
    });
    test.totalMarks = test.questions.reduce((s,q)=>s+(q.marks||0),0);
    DB.saveTest(test);
    renderModCreate(c);
  };

  // PDF handling
  $('#pdfFile').onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    const buf = await file.arrayBuffer();
    currentPdf = await pdfjsLib.getDocument({data:buf}).promise;
    currentPageNum = 1;
    renderPdfPage();
  };
  $('#prevPage').onclick = () => { if(currentPageNum>1){ currentPageNum--; renderPdfPage(); } };
  $('#nextPage').onclick = () => { if(currentPdf && currentPageNum<currentPdf.numPages){ currentPageNum++; renderPdfPage(); } };

  // Crop box drag
  const viewer = $('#pdfViewer');
  const box = $('#cropBox');
  viewer.addEventListener('mousedown', e => {
    if(e.target !== $('#pdfCanvas')) return;
    const rect = viewer.getBoundingClientRect();
    cropStart = { x: e.clientX - rect.left + viewer.scrollLeft, y: e.clientY - rect.top + viewer.scrollTop };
    box.style.display = 'block';
    box.style.left = cropStart.x + 'px';
    box.style.top = cropStart.y + 'px';
    box.style.width = '0px'; box.style.height = '0px';
    isDragging = true;
  });
  viewer.addEventListener('mousemove', e => {
    if(!isDragging) return;
    const rect = viewer.getBoundingClientRect();
    const x = e.clientX - rect.left + viewer.scrollLeft;
    const y = e.clientY - rect.top + viewer.scrollTop;
    box.style.left = Math.min(cropStart.x, x) + 'px';
    box.style.top = Math.min(cropStart.y, y) + 'px';
    box.style.width = Math.abs(x - cropStart.x) + 'px';
    box.style.height = Math.abs(y - cropStart.y) + 'px';
  });
  viewer.addEventListener('mouseup', async () => {
    if(!isDragging) return;
    isDragging = false;
    const w = parseInt(box.style.width), h = parseInt(box.style.height);
    if(w < 20 || h < 20){ box.style.display='none'; return; }
    // Crop the canvas region
    const canvas = $('#pdfCanvas');
    const cropCanvas = document.createElement('canvas');
    cropCanvas.width = w; cropCanvas.height = h;
    const ctx = cropCanvas.getContext('2d');
    ctx.drawImage(canvas, parseInt(box.style.left), parseInt(box.style.top), w, h, 0, 0, w, h);
    const imageData = cropCanvas.toDataURL('image/png');

    const type = $('#qType').value;
    const marks = +$('#qMarks').value || 1;
    const neg = +$('#qNeg').value || 0;
    const opts = type === 'NAT' ? [] : ['','','',''];

    test.questions = test.questions || [];
    const newQ = {
      id: uid(), type, text:'', image: imageData,
      options: opts, answer:'', marks, negativeMarks: neg,
      order: test.questions.length+1, page: currentPageNum
    };
    test.questions.push(newQ);
    test.totalMarks = test.questions.reduce((s,q)=>s+(q.marks||0),0);
    DB.saveTest(test);
    box.style.display = 'none';
    toast('Question added — edit details below','success');
    renderModCreate(c);
  });

  // Bind question editors
  bindQuestionEditors(test);
}

function renderQuestionEditor(q, i){
  const optInputs = (q.options||[]).map((opt,j) => `
    <div class="option-row">
      <input type="checkbox" data-correct="${j}" ${isCorrectOption(q,j)?'checked':''}/>
      <strong style="min-width:20px">${String.fromCharCode(65+j)}.</strong>
      <input type="text" data-opt="${j}" value="${escapeHtml(opt)}" placeholder="Option ${String.fromCharCode(65+j)}"/>
    </div>`).join('');

  return `<div class="question-editor" data-qid="${q.id}">
    <div class="qe-header">
      <span class="q-num">Q${i+1} · ${q.type} · +${q.marks}/−${q.negativeMarks}</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-secondary" data-up="${i}" style="padding:4px 10px;font-size:12px" ${i===0?'disabled':''}>↑</button>
        <button class="btn btn-secondary" data-down="${i}" style="padding:4px 10px;font-size:12px">↓</button>
        <button class="btn btn-danger" data-delq="${i}" style="padding:4px 10px;font-size:12px">Delete</button>
      </div>
    </div>
    ${q.image ? `<img src="${q.image}" style="max-width:300px;max-height:180px;border-radius:6px;margin-bottom:8px;display:block"/>` : ''}
    <div class="form-group">
      <label>Question Text</label>
      <textarea data-text rows="2" placeholder="Question text (if not using image)">${escapeHtml(q.text||'')}</textarea>
    </div>
    ${q.type !== 'NAT' ? `
      <label style="font-size:13px;font-weight:500;margin-bottom:6px;display:block">Options (tick correct)</label>
      <div class="options-editor">${optInputs}</div>
    ` : `
      <div class="answer-row">
        <label>Correct Answer (numeric):</label>
        <input type="number" step="any" data-answer value="${escapeHtml(q.answer||'')}" placeholder="e.g. 4.5"/>
      </div>
    `}
  </div>`;
}

function isCorrectOption(q, j){
  const letter = String.fromCharCode(65+j);
  if(q.type === 'MSQ') return (q.answer||'').split(',').map(x=>x.trim().toUpperCase()).includes(letter);
  return (q.answer||'').trim().toUpperCase() === letter;
}

function bindQuestionEditors(test){
  $$('[data-up]').forEach(b => b.onclick = () => {
    const i = +b.dataset.up;
    [test.questions[i-1], test.questions[i]] = [test.questions[i], test.questions[i-1]];
    DB.saveTest(test); renderModCreate($('#tabContent'));
  });
  $$('[data-down]').forEach(b => b.onclick = () => {
    const i = +b.dataset.down;
    if(i >= test.questions.length-1) return;
    [test.questions[i+1], test.questions[i]] = [test.questions[i], test.questions[i+1]];
    DB.saveTest(test); renderModCreate($('#tabContent'));
  });
  $$('[data-delq]').forEach(b => b.onclick = () => {
    if(!confirm('Delete this question?')) return;
    test.questions.splice(+b.dataset.delq, 1);
    test.totalMarks = test.questions.reduce((s,q)=>s+(q.marks||0),0);
    DB.saveTest(test); renderModCreate($('#tabContent'));
  });

  $$('.question-editor').forEach(editor => {
    const qid = editor.dataset.qid;
    const q = test.questions.find(x => x.id === qid);
    if(!q) return;
    editor.querySelector('[data-text]').oninput = e => { q.text = e.target.value; DB.saveTest(test); };
    if(q.type !== 'NAT'){
      editor.querySelectorAll('[data-opt]').forEach(inp => {
        inp.oninput = e => { q.options[+inp.dataset.opt] = e.target.value; DB.saveTest(test); };
      });
      editor.querySelectorAll('[data-correct]').forEach(cb => {
        cb.onchange = () => {
          if(q.type === 'MCQ'){
            editor.querySelectorAll('[data-correct]').forEach(x => { if(x!==cb) x.checked=false; });
            q.answer = cb.checked ? String.fromCharCode(65 + +cb.dataset.correct) : '';
          } else {
            const sel = [...editor.querySelectorAll('[data-correct]:checked')].map(x => String.fromCharCode(65 + +x.dataset.correct)).sort().join(',');
            q.answer = sel;
          }
          DB.saveTest(test);
        };
      });
    } else {
      editor.querySelector('[data-answer]').oninput = e => { q.answer = e.target.value; DB.saveTest(test); };
    }
  });
}

async function renderPdfPage(){
  if(!currentPdf) return;
  const page = await currentPdf.getPage(currentPageNum);
  const viewport = page.getViewport({scale: 1.3});
  const canvas = $('#pdfCanvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  $('#pageNum').textContent = currentPageNum;
  $('#pageCount').textContent = currentPdf.numPages;
}

function renderModResults(c){
  const tests = DB.getTests();
  const attempts = DB.getAttempts().filter(a => a.status==='submitted');
  c.innerHTML = `
    <div class="section">
      <div class="section-header">
        <h3>All Results (${attempts.length})</h3>
        <button class="btn btn-secondary" id="exportCsv">Export CSV</button>
      </div>
      ${attempts.length ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Student</th><th>Roll No</th><th>Test</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Submitted</th></tr></thead>
          <tbody>${attempts.map(a => {
            const u = DB.getUsers().find(x => x.id === a.studentId);
            const t = DB.getTest(a.testId);
            return `<tr>
              <td>${escapeHtml(u?.name||'—')}</td>
              <td>${escapeHtml(u?.rollNumber||'—')}</td>
              <td>${escapeHtml(t?.title||'—')}</td>
              <td><strong>${a.score}</strong> / ${t?.totalMarks||0}</td>
              <td style="color:var(--success)">${a.correct}</td>
              <td style="color:var(--danger)">${a.wrong}</td>
              <td>${a.skipped}</td>
              <td>${fmtDate(a.submittedAt)}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`
        : `<div class="empty-state"><p>No submissions yet.</p></div>`}
    </div>`;
  $('#exportCsv').onclick = () => {
    const rows = [['Name','Roll','Test','Score','Correct','Wrong','Skipped','Submitted']];
    attempts.forEach(a => {
      const u = DB.getUsers().find(x => x.id === a.studentId);
      const t = DB.getTest(a.testId);
      rows.push([u?.name||'', u?.rollNumber||'', t?.title||'', a.score, a.correct, a.wrong, a.skipped, new Date(a.submittedAt).toISOString()]);
    });
    const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'results.csv'; a.click();
  };
}

function renderModStudents(c){
  const students = DB.getUsers().filter(u => u.role === 'student');
  c.innerHTML = `
    <div class="section">
      <h3 style="margin-bottom:16px">Registered Students (${students.length})</h3>
      ${students.length ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Roll No</th><th>Email</th><th>Attempts</th><th>Joined</th></tr></thead>
          <tbody>${students.map(s => {
            const att = DB.getStudentAttempts(s.id).length;
            return `<tr>
              <td>${escapeHtml(s.name)}</td>
              <td>${escapeHtml(s.rollNumber||'—')}</td>
              <td>${escapeHtml(s.email)}</td>
              <td>${att}</td>
              <td>${fmtDate(s.createdAt)}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`
        : `<div class="empty-state"><p>No students registered yet.</p></div>`}
    </div>`;
}

Router.register('/', viewLanding);
Router.register('/student/login', () => viewLogin('student'));
Router.register('/moderator/login', () => viewLogin('moderator'));
Router.register('/student/register', viewRegister);
Router.register('/student', () => {
  if(!Auth.current()) return Router.go('#/student/login');
  if(Auth.current().role !== 'student') return Router.go('#/');
  viewStudentDash();
});
Router.register('/moderator', () => {
  if(!Auth.current()) return Router.go('#/moderator/login');
  if(Auth.current().role !== 'moderator') return Router.go('#/');
  viewModeratorDash();
});

/* Auto-redirect if already logged in */
const sess = Auth.current();
if(sess && location.hash === '#/'){
  Router.go('#/' + sess.role);
} else {
  Router.start();
}
